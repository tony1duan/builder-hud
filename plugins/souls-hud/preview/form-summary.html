<!doctype html>
<!--
  The page `test/form.mjs` composes and screenshots.

  It is a real file rather than a template literal inside the test because the
  in-page script is full of backticks and `${…}` in comments and strings — every
  one of which used to be a parse error in the *test* rather than in the page.
  Here the only contract is the five placeholder comments below, each replaced by
  `test/form.mjs` with a function replacement (so `$&` in the injected source
  cannot be read as a substitution).
-->
<html lang="en"><head><meta charset="utf-8"><title>souls-hud settings form</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 18px 22px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--dsw-alias-bg-base, #f6f6f6); color: var(--dsw-alias-label-primary, #1a1a1a); }
  body[data-dark] { --dsw-alias-bg-base: #1c1c1e; --dsw-alias-label-primary: #ededed;
                    --dsw-alias-label-tertiary: #9a9a9a; --dsw-alias-border-l2: rgba(255,255,255,0.16);
                    --dsw-alias-bg-module-platform: rgba(255,255,255,0.06); }
  #form { max-width: 460px; }
  .page-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .page-kind { font-size: 12px; color: var(--dsw-alias-label-tertiary, #8a8a8a); margin-bottom: 6px; }
/* ============================================================================
 * BuilderHUD — the Souls HUD stylesheet
 *
 * A Dark Souls vitals cluster shaped for the sidebar's brand row: an engraved
 * medallion on the left, three equal-length bars on the right.
 *
 * Straight right ends, a solid presence (no idle fading), a recessed near-black
 * socket, a warm engraved-metal rim, and a glassy top edge on each fill.
 * Everything is click-through and self-contained; it never reads app tokens.
 *
 * The medallion's *geometry* is fixed in `hud.js`; everything about how it
 * *looks* is here. Two knobs:
 *
 *   - `data-material` selects the metal (bronze | iron | silver | gold);
 *   - an ancestor carrying `data-ds-dark-theme` (the app puts it on `<body>`)
 *     selects that metal's dark cut. Written as an ancestor rather than `body`
 *     so the settings form's preview can show a dark cell inside a light page.
 *
 * Each material therefore has two full palettes — eight in all — and the plate
 * and the device read the same set of variables, so whatever is struck into the
 * field is literally cast from the same metal as the rim.
 * ========================================================================== */

:root {
  /* Overridden at runtime by the renderer, which measures the sidebar. These
     are the pre-measure fallback. */
  --dsh-sh-x: 20px;
  --dsh-sh-y: 40px;
  --dsh-sh-scale: 1;
  --dsh-sh-width: 96px;
  --dsh-sh-h: 9px;
  --dsh-sh-gap: 4px;
  --dsh-sh-ease: 1100ms;
}

#dsh-souls-hud {
  position: fixed;
  left: var(--dsh-sh-x);
  top: var(--dsh-sh-y);
  /* The app's own layering scale, read from its stylesheet: 10 dock scrim,
     70 menus, 100/101 popovers, 1000 modal root and backdrop, 1100 toasts.
     The cluster is chrome inside the sidebar, so it must sit above in-flow
     content but *under* every one of those overlays — the account menu and the
     context popover are opened from these bars, and the Settings modal has to
     cover them. 60 keeps it above the sidebar and below all of them. */
  z-index: 60;
  margin: 0;
  padding: 0;
  /* Mark on the left, the bar stack on the right. */
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 9px;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  /* Solid, always: the cluster is a fixture of the sidebar, not a HUD that
     fades in and out while you scroll. */
  opacity: 1;
  transform: scale(var(--dsh-sh-scale));
  transform-origin: 0 0;
  color: #cfc3a4;
  font-family: "Palatino Linotype", "Book Antiqua", Palatino, "Songti SC",
    "Times New Roman", serif;
  -webkit-font-smoothing: antialiased;
}

#dsh-souls-hud.dsh-sh--offline {
  opacity: 0.45;
}

/* --- the medallion, and the eight metals it can be cast from ---------------- */

.dsh-sh__mark {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  display: block;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
}
.dsh-sh__mark > svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* Bronze, light — the original plate, and the default when nothing has been
   chosen yet. The five `metal` stops run the plate's bevel from the lit upper
   left to the shadowed lower right; the four `device` stops are the same light
   with less range, so the device reads as the same casting. */
.dsh-sh__mark,
.dsh-sh__mark[data-material="bronze"] {
  --dsh-sh-metal-0: #fdf1cd;
  --dsh-sh-metal-1: #d8b673;
  --dsh-sh-metal-2: #9a7a3e;
  --dsh-sh-metal-3: #5f4a20;
  --dsh-sh-metal-4: #2b2009;
  --dsh-sh-field: #efe6cf;
  --dsh-sh-lip: rgba(255, 245, 220, 0.5);
  --dsh-sh-crack: rgba(132, 104, 58, 0.42);
  --dsh-sh-pit: rgba(110, 86, 46, 0.4);
}

/* Iron, light — blue steel. It used to be a neutral grey a shade darker than
   silver, which at 16px read as "silver, in shadow"; the blue cast is what lets
   the two be told apart at a glance. */
.dsh-sh__mark[data-material="iron"] {
  --dsh-sh-metal-0: #e6f0f8;
  --dsh-sh-metal-1: #9fb3c4;
  --dsh-sh-metal-2: #6d8499;
  --dsh-sh-metal-3: #3f5365;
  --dsh-sh-metal-4: #1b2630;
  --dsh-sh-field: #dde7f0;
  --dsh-sh-lip: rgba(230, 242, 252, 0.52);
  --dsh-sh-crack: rgba(58, 80, 102, 0.42);
  --dsh-sh-pit: rgba(44, 66, 88, 0.4);
}

/* Silver, light — the brightest cut: a near-white bevel over a slate base. */
.dsh-sh__mark[data-material="silver"] {
  --dsh-sh-metal-0: #ffffff;
  --dsh-sh-metal-1: #e2e9ef;
  --dsh-sh-metal-2: #aab6c0;
  --dsh-sh-metal-3: #6d7b87;
  --dsh-sh-metal-4: #333c44;
  --dsh-sh-field: #e9eef3;
  --dsh-sh-lip: rgba(255, 255, 255, 0.62);
  --dsh-sh-crack: rgba(78, 90, 100, 0.36);
  --dsh-sh-pit: rgba(64, 76, 88, 0.32);
}

/* Gold, light — yellow metal: more saturation than bronze, less red. */
.dsh-sh__mark[data-material="gold"] {
  --dsh-sh-metal-0: #fff8d8;
  --dsh-sh-metal-1: #f3dc86;
  --dsh-sh-metal-2: #c9a13c;
  --dsh-sh-metal-3: #8a6a1c;
  --dsh-sh-metal-4: #43310a;
  --dsh-sh-field: #f4ecd0;
  --dsh-sh-lip: rgba(255, 250, 225, 0.55);
  --dsh-sh-crack: rgba(146, 112, 34, 0.4);
  --dsh-sh-pit: rgba(120, 90, 24, 0.38);
}

/* The dark cut of each metal. Not an inverted plate and not a dimmed one: the
   bevel is re-lit for a dark sidebar, the recess goes properly dark, and the
   device keeps enough contrast to stay legible at 16px. */
[data-ds-dark-theme] .dsh-sh__mark,
[data-ds-dark-theme] .dsh-sh__mark[data-material="bronze"] {
  --dsh-sh-metal-0: #c9a869;
  --dsh-sh-metal-1: #a07f42;
  --dsh-sh-metal-2: #6f5526;
  --dsh-sh-metal-3: #40300f;
  --dsh-sh-metal-4: #170f03;
  --dsh-sh-field: #241d13;
  --dsh-sh-lip: rgba(255, 236, 196, 0.28);
  --dsh-sh-crack: rgba(214, 178, 110, 0.28);
  --dsh-sh-pit: rgba(180, 146, 84, 0.32);
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55));
}
[data-ds-dark-theme] .dsh-sh__mark[data-material="iron"] {
  --dsh-sh-metal-0: #c6d9ea;
  --dsh-sh-metal-1: #8ba3b9;
  --dsh-sh-metal-2: #5a7089;
  --dsh-sh-metal-3: #32434f;
  --dsh-sh-metal-4: #101a21;
  --dsh-sh-field: #16202a;
  --dsh-sh-lip: rgba(210, 232, 250, 0.26);
  --dsh-sh-crack: rgba(170, 198, 222, 0.26);
  --dsh-sh-pit: rgba(132, 160, 186, 0.32);
}
[data-ds-dark-theme] .dsh-sh__mark[data-material="silver"] {
  --dsh-sh-metal-0: #dbe5ee;
  --dsh-sh-metal-1: #aebcc8;
  --dsh-sh-metal-2: #7a8794;
  --dsh-sh-metal-3: #4a545e;
  --dsh-sh-metal-4: #1f262c;
  --dsh-sh-field: #1b2127;
  --dsh-sh-lip: rgba(232, 242, 250, 0.26);
  --dsh-sh-crack: rgba(200, 214, 226, 0.22);
  --dsh-sh-pit: rgba(168, 182, 196, 0.28);
}
[data-ds-dark-theme] .dsh-sh__mark[data-material="gold"] {
  --dsh-sh-metal-0: #e8d38a;
  --dsh-sh-metal-1: #c2a548;
  --dsh-sh-metal-2: #8d722a;
  --dsh-sh-metal-3: #574314;
  --dsh-sh-metal-4: #1f1704;
  --dsh-sh-field: #241d0c;
  --dsh-sh-lip: rgba(255, 238, 180, 0.26);
  --dsh-sh-crack: rgba(222, 192, 116, 0.26);
  --dsh-sh-pit: rgba(190, 160, 90, 0.3);
}

/* --- the device is the material --------------------------------------------
   The stops are *defined as* metal stops, not as a second palette that happens
   to agree: whatever the plate's bevel is made of, the symbol stamped into it is
   made of the same thing. Custom properties are substituted where they are used,
   so these references resolve against the material block on the same element and
   the two can never drift apart.

   The light cut takes the darker half of the ramp (the motif has to read against
   a pale field); the dark cut takes the brighter half (against a dark one). */
.dsh-sh__mark {
  --dsh-sh-device-0: var(--dsh-sh-metal-1);
  --dsh-sh-device-1: var(--dsh-sh-metal-2);
  --dsh-sh-device-2: var(--dsh-sh-metal-3);
  --dsh-sh-device-3: var(--dsh-sh-metal-4);
  --dsh-sh-ink: var(--dsh-sh-metal-1);
}
[data-ds-dark-theme] .dsh-sh__mark {
  --dsh-sh-device-0: var(--dsh-sh-metal-0);
  --dsh-sh-device-1: var(--dsh-sh-metal-1);
  --dsh-sh-device-2: var(--dsh-sh-metal-2);
  --dsh-sh-device-3: var(--dsh-sh-metal-3);
}

/* The plate's own outline, and the milled edge of a struck medal. */
.dsh-sh__mark .dsh-sh__edge {
  stroke: rgba(24, 18, 6, 0.85);
}
.dsh-sh__mark .dsh-sh__mill {
  stroke: rgba(255, 246, 222, 0.34);
}
[data-ds-dark-theme] .dsh-sh__mark .dsh-sh__edge {
  stroke: rgba(0, 0, 0, 0.72);
}
[data-ds-dark-theme] .dsh-sh__mark .dsh-sh__mill {
  stroke: rgba(255, 240, 205, 0.2);
}

/* The recessed field is the **material's**, and nothing else's.
   An experiment tinted it per device (a covenant-colour enamel: amber sun, blue
   moon, green wolf) to follow Dark Souls III's colour-coded covenant emblems. It
   read well, but it made the badge's *background* change when the user only meant
   to change the figure — so the device now decides the figure and the material
   decides everything around it. If the enamel comes back, it comes back as a
   setting, not as a side effect of picking a motif. */

/* Recessed field, its fractures, its pitting, and the device inside it. */
.dsh-sh__mark .dsh-sh__field {
  fill: var(--dsh-sh-field, #efe6cf);
}
.dsh-sh__mark .dsh-sh__lip {
  stroke: var(--dsh-sh-lip, rgba(255, 245, 220, 0.5));
}
.dsh-sh__mark .dsh-sh__cracks {
  stroke: var(--dsh-sh-crack, rgba(132, 104, 58, 0.42));
}
.dsh-sh__mark .dsh-sh__pits {
  fill: var(--dsh-sh-pit, rgba(110, 86, 46, 0.4));
}

/* --- the device ------------------------------------------------------------
   Everything the device draws is repainted from the metal, whatever the upload
   said its colours were. That is the whole "blend into the badge" contract, and
   it is enforced here rather than by trusting the file:

   - a *filled* shape (a normalized upload marks it `fill="currentColor"`) gets
     the device gradient, so it picks up the plate's own light direction;
   - *line art* (`fill="none"` plus a stroke) stays line art — filling it would
     turn a drawn outline into a blob — but it is struck from the same metal;
   - the catch-all covers anything a hand-edited file left without a fill at
     all, which would otherwise render as a black silhouette leaking through
     the metal.

   Scoped to `#dsh-souls-hud` on purpose. These rules name the live mark's
   gradient **by id**, and SVG ids are document-global: a second medallion on the
   page — the settings form's preview — would resolve `url(#dsh-sh-device)` to
   the live mark's gradient and show the wrong metal. The preview therefore draws
   its own, uniquely-identified gradients and is deliberately outside these
   rules. (Found the hard way: the devices × metals gallery rendered four
   identical metals.) */
#dsh-souls-hud .dsh-sh__mark .dsh-sh__device {
  color: var(--dsh-sh-ink, #cba96c);
  filter: drop-shadow(0 0.7px 0.6px rgba(18, 12, 2, 0.75));
}
#dsh-souls-hud .dsh-sh__mark .dsh-sh__device :is(path, polygon, polyline, circle, ellipse, rect, text, tspan) {
  fill: url(#dsh-sh-device);
}
#dsh-souls-hud .dsh-sh__mark .dsh-sh__device [fill="none"] {
  fill: none;
  stroke: url(#dsh-sh-device);
}
#dsh-souls-hud .dsh-sh__mark .dsh-sh__device [stroke="currentColor"] {
  stroke: url(#dsh-sh-device);
}
#dsh-souls-hud .dsh-sh__mark .dsh-sh__device line {
  fill: none;
  stroke: url(#dsh-sh-device);
}

/* --- the burn gauge and the tariff window ------------------------------------
   Two signals, two channels, so neither can hide the other:

   - the **length** of the lit arc along the milled edge is how fast tokens are
     being spent right now (`renderBurn` re-points the path; it runs exactly on
     the beaded rim, so what lights up is the medal's own edge);
   - its **colour** is the tariff window that spending falls in — amber on peak
     hours, cool blue off-peak, neutral when the reading is switched off.

   The coarse `data-burn` level (0–4) drives how insistent the arc looks, and the
   top level breathes. */
.dsh-sh__mark .dsh-sh__gauge {
  stroke: rgba(255, 246, 222, 0.62);
  stroke-width: 1.5;
  opacity: 0.85;
  /* The gauge is one full-length path whose visible arc is a dash: the fill is
     `stroke-dashoffset`, which CSS can animate. Rewriting the path's `d` on every
     poll — the first implementation — cannot be transitioned and snapped. */
  transition: stroke-dashoffset 1200ms cubic-bezier(0.25, 0.8, 0.3, 1),
    stroke 600ms linear, opacity 400ms linear;
}
.dsh-sh__mark[data-tariff="peak"] .dsh-sh__gauge {
  stroke: #ffc46a;
  filter: drop-shadow(0 0 1.4px rgba(255, 166, 60, 0.75));
}
.dsh-sh__mark[data-tariff="offpeak"] .dsh-sh__gauge {
  stroke: #9fe3ff;
  filter: drop-shadow(0 0 1.4px rgba(120, 210, 255, 0.75));
}
.dsh-sh__mark[data-burn="2"] .dsh-sh__gauge {
  stroke-width: 1.7;
  opacity: 0.95;
}
.dsh-sh__mark[data-burn="3"] .dsh-sh__gauge {
  stroke-width: 1.9;
  opacity: 1;
  filter: drop-shadow(0 0 2.2px currentColor);
}
.dsh-sh__mark[data-burn="4"] .dsh-sh__gauge {
  stroke-width: 2.1;
  opacity: 1;
  filter: drop-shadow(0 0 2.6px rgba(255, 180, 90, 0.85));
  animation: dsh-sh-ember 1.8s ease-in-out infinite;
}
/* The ember breathes at the top level; the arc itself stays put. */
@keyframes dsh-sh-ember {
  0%,
  100% {
    opacity: 0.78;
  }
  50% {
    opacity: 1;
  }
}

/* The settings form's preview: a real medallion, drawn standalone. Its own metal
   is baked into the markup (see `previewSvg`), so it only needs the box. */
.dsh-sh__mark[data-preview] {
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
}


/* The three bars, stacked. */
.dsh-sh__stack {
  display: flex;
  flex-direction: column;
  gap: var(--dsh-sh-gap);
  min-width: 0;
}

/* --- the numeric readouts ------------------------------------------------ */
/* Hidden with opacity rather than by unmounting, so the bars keep their length
   and nothing reflows when the pointer arrives. */
.dsh-sh--numbers-hover .dsh-sh__read,
.dsh-sh--numbers-hidden .dsh-sh__read {
  opacity: 0;
  transition: opacity 0.14s ease;
}
/* Hover mode needs the pointer, which the click-through cluster otherwise
   ignores. The box covers the sidebar's brand row, where nothing is clickable,
   so taking it back costs nothing. */
#dsh-souls-hud.dsh-sh--numbers-hover {
  pointer-events: auto;
}
#dsh-souls-hud.dsh-sh--numbers-hover:hover .dsh-sh__read {
  opacity: 1;
}

/* --- one vitals row -------------------------------------------------------- */
.dsh-sh__row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0;
}

/* The wallet rows are the one interactive part: the cluster is click-through
   everywhere else, so a tap on HP or FP opens Settings. */
.dsh-sh__row--action {
  pointer-events: auto;
  cursor: pointer;
}
.dsh-sh__row--action:hover .dsh-sh__fill {
  filter: brightness(1.25);
}

/* Per-bar palette. DS vitals: crimson HP, deep-blue FP, yellow-green stamina.
   All three share the one measured width, so they are always the same length. */
.dsh-sh__row[data-kind="hp"] {
  --dsh-sh-c1: #c94a3c;
  --dsh-sh-c2: #8d150c;
  --dsh-sh-c3: #330401;
  --dsh-sh-glow: rgba(232, 48, 28, 0.42);
  --dsh-sh-tint: #dda294;
}
.dsh-sh__row[data-kind="fp"] {
  --dsh-sh-c1: #5b90dd;
  --dsh-sh-c2: #1e4699;
  --dsh-sh-c3: #061138;
  --dsh-sh-glow: rgba(56, 116, 235, 0.42);
  --dsh-sh-tint: #9fbde8;
}
.dsh-sh__row[data-kind="sp"] {
  --dsh-sh-c1: #9dc44e;
  --dsh-sh-c2: #5f8815;
  --dsh-sh-c3: #1a2c04;
  --dsh-sh-glow: rgba(128, 196, 44, 0.4);
  --dsh-sh-tint: #c4d894;
}

/* --- the metal rim + the recessed socket ----------------------------------- */
.dsh-sh__shell {
  position: relative;
  flex: 0 0 auto;
  width: var(--dsh-sh-width);
  height: var(--dsh-sh-h);
  padding: 1px;
  box-sizing: border-box;
  border-radius: 3px;
  /* Warm engraved-metal hairline, brightest along the top edge. */
  background: linear-gradient(
    180deg,
    rgba(214, 190, 138, 0.5) 0%,
    rgba(140, 120, 76, 0.26) 42%,
    rgba(46, 39, 24, 0.5) 100%
  );
  filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.7));
}

.dsh-sh__socket {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 2px;
  /* Recess: a warm lip at the top, near-black through the body, dead at the
     base. Never pure black — the empty track must still read as a surface. */
  background: linear-gradient(
    180deg,
    #221d16 0%,
    #16120d 38%,
    #0c0a08 68%,
    #050404 100%
  );
  box-shadow: inset 0 1px 0 rgba(255, 246, 222, 0.1),
    inset 0 -1px 2px rgba(0, 0, 0, 0.85), inset 0 0 5px rgba(0, 0, 0, 0.7);
}

/* Fine vertical grain — the "grit" that keeps the bars from looking flat. */
.dsh-sh__socket::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: repeating-linear-gradient(
      90deg,
      rgba(255, 255, 255, 0.03) 0px,
      rgba(255, 255, 255, 0.03) 1px,
      rgba(0, 0, 0, 0.04) 1px,
      rgba(0, 0, 0, 0.04) 4px
    ),
    linear-gradient(
      104deg,
      rgba(255, 255, 255, 0.035) 0%,
      rgba(255, 255, 255, 0) 34%,
      rgba(0, 0, 0, 0.06) 70%,
      rgba(0, 0, 0, 0) 100%
    );
  mix-blend-mode: overlay;
  opacity: 0.6;
}

/* --- the pale "just lost / just gained" trail ------------------------------ */
.dsh-sh__ghost {
  position: absolute;
  left: 0;
  top: 1px;
  bottom: 1px;
  width: 0%;
  border-radius: 1.5px;
  background: linear-gradient(
    180deg,
    rgba(255, 250, 238, 0.92) 0%,
    rgba(246, 228, 198, 0.78) 55%,
    rgba(206, 176, 132, 0.7) 100%
  );
  transition: width 620ms cubic-bezier(0.33, 0, 0.2, 1);
}

/* --- the value fill -------------------------------------------------------- */
.dsh-sh__fill {
  position: absolute;
  left: 0;
  top: 1px;
  bottom: 1px;
  width: 0%;
  border-radius: 1.5px;
  /* A specular wash over a hard vertical fall-off: bright lip, blood-dark base. */
  background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.15) 0%,
      rgba(255, 255, 255, 0) 20%
    ),
    linear-gradient(
      180deg,
      var(--dsh-sh-c1) 0%,
      var(--dsh-sh-c2) 36%,
      var(--dsh-sh-c2) 58%,
      var(--dsh-sh-c3) 100%
    );
  box-shadow: 0 0 5px var(--dsh-sh-glow), inset 0 -1px 1px rgba(0, 0, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.07);
  transition: width var(--dsh-sh-ease) cubic-bezier(0.22, 0.61, 0.36, 1);
}

/* Glassy top edge + a brighter leading meniscus at the fill's right end. */
.dsh-sh__fill::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 1px;
  background: rgba(255, 255, 255, 0.26);
}
.dsh-sh__fill::before {
  content: "";
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(255, 255, 255, 0.16);
  box-shadow: 0 0 3px rgba(255, 255, 255, 0.12);
}

/* Critical state: the vitals pulse the way they do when you are about to die. */
.dsh-sh__row.is-critical .dsh-sh__fill {
  animation: dsh-sh-pulse 1.5s ease-in-out infinite;
}
@keyframes dsh-sh-pulse {

  100% {

  50% {

    box-shadow: 0 0 10px var(--dsh-sh-glow), 0 0 18px var(--dsh-sh-glow);
  }
}

/* A freshly changed bar flashes, then settles. */
.dsh-sh__row.is-changed .dsh-sh__fill {
  animation: dsh-sh-flash 620ms ease-out 1;
}
@keyframes dsh-sh-flash {
  0% {
    filter: brightness(1.7);
  }
  100% {

}

/* Unknown value: the socket stays cold and empty. */
.dsh-sh__row.is-unknown .dsh-sh__fill,
.dsh-sh__row.is-unknown .dsh-sh__ghost {
  width: 0% !important;
}

/* --- engraved readouts ----------------------------------------------------- */
.dsh-sh__read {
  display: flex;
  align-items: baseline;
  gap: 4px;
  /* One fixed column, so every bar ends at the same place. */
  min-width: 46px;
  font-size: 10px;
  line-height: 1;
  white-space: nowrap;
  color: var(--dsh-sh-ink);
  letter-spacing: 0.02em;
  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.8);
}
.dsh-sh__read .dsh-sh__value {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--dsh-sh-tint);
}
.dsh-sh__read .dsh-sh__detail {
  font-style: normal;
  font-size: 9px;
  opacity: 0.55;
  font-variant-numeric: tabular-nums;
}

/* Light theme: the app marks dark mode on <body>, so the readouts flip to dark
   ink with a light rim instead of parchment over a dark halo. The bars
   themselves always stay dark — a Dark Souls HUD does not go pastel. */
body:not([data-ds-dark-theme]) .dsh-sh__read {
  color: #4a4234;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8), 0 0 4px rgba(255, 255, 255, 0.7);
}
body:not([data-ds-dark-theme]) .dsh-sh__read .dsh-sh__value {
  filter: brightness(0.58) saturate(1.2);
}
body:not([data-ds-dark-theme]) .dsh-sh__read .dsh-sh__detail {
  opacity: 0.66;
}

/* Respect a user who asked for less motion. */
@media (prefers-reduced-motion: reduce) {
  #dsh-souls-hud,
  .dsh-sh__fill,
  .dsh-sh__ghost {
    transition: none !important;
  }

  .dsh-sh__row.is-changed .dsh-sh__fill,
  .dsh-sh__mark[data-burn="4"] .dsh-sh__gauge {
    animation: none !important;
  }
}

<script>window.__CSS__ = "/* ============================================================================\n * BuilderHUD — the Souls HUD stylesheet\n *\n * A Dark Souls vitals cluster shaped for the sidebar's brand row: an engraved\n * medallion on the left, three equal-length bars on the right.\n *\n * Straight right ends, a solid presence (no idle fading), a recessed near-black\n * socket, a warm engraved-metal rim, and a glassy top edge on each fill.\n * Everything is click-through and self-contained; it never reads app tokens.\n *\n * The medallion's *geometry* is fixed in `hud.js`; everything about how it\n * *looks* is here. Two knobs:\n *\n *   - `data-material` selects the metal (bronze | iron | silver | gold);\n *   - an ancestor carrying `data-ds-dark-theme` (the app puts it on `<body>`)\n *     selects that metal's dark cut. Written as an ancestor rather than `body`\n *     so the settings form's preview can show a dark cell inside a light page.\n *\n * Each material therefore has two full palettes — eight in all — and the plate\n * and the device read the same set of variables, so whatever is struck into the\n * field is literally cast from the same metal as the rim.\n * ========================================================================== */\n\n:root {\n  /* Overridden at runtime by the renderer, which measures the sidebar. These\n     are the pre-measure fallback. */\n  --dsh-sh-x: 20px;\n  --dsh-sh-y: 40px;\n  --dsh-sh-scale: 1;\n  --dsh-sh-width: 96px;\n  --dsh-sh-h: 9px;\n  --dsh-sh-gap: 4px;\n  --dsh-sh-ease: 1100ms;\n}\n\n#dsh-souls-hud {\n  position: fixed;\n  left: var(--dsh-sh-x);\n  top: var(--dsh-sh-y);\n  /* The app's own layering scale, read from its stylesheet: 10 dock scrim,\n     70 menus, 100/101 popovers, 1000 modal root and backdrop, 1100 toasts.\n     The cluster is chrome inside the sidebar, so it must sit above in-flow\n     content but *under* every one of those overlays — the account menu and the\n     context popover are opened from these bars, and the Settings modal has to\n     cover them. 60 keeps it above the sidebar and below all of them. */\n  z-index: 60;\n  margin: 0;\n  padding: 0;\n  /* Mark on the left, the bar stack on the right. */\n  display: flex;\n  flex-direction: row;\n  align-items: center;\n  gap: 9px;\n  pointer-events: none;\n  user-select: none;\n  -webkit-user-select: none;\n  /* Solid, always: the cluster is a fixture of the sidebar, not a HUD that\n     fades in and out while you scroll. */\n  opacity: 1;\n  transform: scale(var(--dsh-sh-scale));\n  transform-origin: 0 0;\n  color: #cfc3a4;\n  font-family: \"Palatino Linotype\", \"Book Antiqua\", Palatino, \"Songti SC\",\n    \"Times New Roman\", serif;\n  -webkit-font-smoothing: antialiased;\n}\n\n#dsh-souls-hud.dsh-sh--offline {\n  opacity: 0.45;\n}\n\n/* --- the medallion, and the eight metals it can be cast from ---------------- */\n\n.dsh-sh__mark {\n  flex: 0 0 auto;\n  width: 32px;\n  height: 32px;\n  display: block;\n  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));\n}\n.dsh-sh__mark > svg {\n  display: block;\n  width: 100%;\n  height: 100%;\n  overflow: visible;\n}\n\n/* Bronze, light — the original plate, and the default when nothing has been\n   chosen yet. The five `metal` stops run the plate's bevel from the lit upper\n   left to the shadowed lower right; the four `device` stops are the same light\n   with less range, so the device reads as the same casting. */\n.dsh-sh__mark,\n.dsh-sh__mark[data-material=\"bronze\"] {\n  --dsh-sh-metal-0: #fdf1cd;\n  --dsh-sh-metal-1: #d8b673;\n  --dsh-sh-metal-2: #9a7a3e;\n  --dsh-sh-metal-3: #5f4a20;\n  --dsh-sh-metal-4: #2b2009;\n  --dsh-sh-field: #efe6cf;\n  --dsh-sh-lip: rgba(255, 245, 220, 0.5);\n  --dsh-sh-crack: rgba(132, 104, 58, 0.42);\n  --dsh-sh-pit: rgba(110, 86, 46, 0.4);\n}\n\n/* Iron, light — blue steel. It used to be a neutral grey a shade darker than\n   silver, which at 16px read as \"silver, in shadow\"; the blue cast is what lets\n   the two be told apart at a glance. */\n.dsh-sh__mark[data-material=\"iron\"] {\n  --dsh-sh-metal-0: #e6f0f8;\n  --dsh-sh-metal-1: #9fb3c4;\n  --dsh-sh-metal-2: #6d8499;\n  --dsh-sh-metal-3: #3f5365;\n  --dsh-sh-metal-4: #1b2630;\n  --dsh-sh-field: #dde7f0;\n  --dsh-sh-lip: rgba(230, 242, 252, 0.52);\n  --dsh-sh-crack: rgba(58, 80, 102, 0.42);\n  --dsh-sh-pit: rgba(44, 66, 88, 0.4);\n}\n\n/* Silver, light — the brightest cut: a near-white bevel over a slate base. */\n.dsh-sh__mark[data-material=\"silver\"] {\n  --dsh-sh-metal-0: #ffffff;\n  --dsh-sh-metal-1: #e2e9ef;\n  --dsh-sh-metal-2: #aab6c0;\n  --dsh-sh-metal-3: #6d7b87;\n  --dsh-sh-metal-4: #333c44;\n  --dsh-sh-field: #e9eef3;\n  --dsh-sh-lip: rgba(255, 255, 255, 0.62);\n  --dsh-sh-crack: rgba(78, 90, 100, 0.36);\n  --dsh-sh-pit: rgba(64, 76, 88, 0.32);\n}\n\n/* Gold, light — yellow metal: more saturation than bronze, less red. */\n.dsh-sh__mark[data-material=\"gold\"] {\n  --dsh-sh-metal-0: #fff8d8;\n  --dsh-sh-metal-1: #f3dc86;\n  --dsh-sh-metal-2: #c9a13c;\n  --dsh-sh-metal-3: #8a6a1c;\n  --dsh-sh-metal-4: #43310a;\n  --dsh-sh-field: #f4ecd0;\n  --dsh-sh-lip: rgba(255, 250, 225, 0.55);\n  --dsh-sh-crack: rgba(146, 112, 34, 0.4);\n  --dsh-sh-pit: rgba(120, 90, 24, 0.38);\n}\n\n/* The dark cut of each metal. Not an inverted plate and not a dimmed one: the\n   bevel is re-lit for a dark sidebar, the recess goes properly dark, and the\n   device keeps enough contrast to stay legible at 16px. */\n[data-ds-dark-theme] .dsh-sh__mark,\n[data-ds-dark-theme] .dsh-sh__mark[data-material=\"bronze\"] {\n  --dsh-sh-metal-0: #c9a869;\n  --dsh-sh-metal-1: #a07f42;\n  --dsh-sh-metal-2: #6f5526;\n  --dsh-sh-metal-3: #40300f;\n  --dsh-sh-metal-4: #170f03;\n  --dsh-sh-field: #241d13;\n  --dsh-sh-lip: rgba(255, 236, 196, 0.28);\n  --dsh-sh-crack: rgba(214, 178, 110, 0.28);\n  --dsh-sh-pit: rgba(180, 146, 84, 0.32);\n  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55));\n}\n[data-ds-dark-theme] .dsh-sh__mark[data-material=\"iron\"] {\n  --dsh-sh-metal-0: #c6d9ea;\n  --dsh-sh-metal-1: #8ba3b9;\n  --dsh-sh-metal-2: #5a7089;\n  --dsh-sh-metal-3: #32434f;\n  --dsh-sh-metal-4: #101a21;\n  --dsh-sh-field: #16202a;\n  --dsh-sh-lip: rgba(210, 232, 250, 0.26);\n  --dsh-sh-crack: rgba(170, 198, 222, 0.26);\n  --dsh-sh-pit: rgba(132, 160, 186, 0.32);\n}\n[data-ds-dark-theme] .dsh-sh__mark[data-material=\"silver\"] {\n  --dsh-sh-metal-0: #dbe5ee;\n  --dsh-sh-metal-1: #aebcc8;\n  --dsh-sh-metal-2: #7a8794;\n  --dsh-sh-metal-3: #4a545e;\n  --dsh-sh-metal-4: #1f262c;\n  --dsh-sh-field: #1b2127;\n  --dsh-sh-lip: rgba(232, 242, 250, 0.26);\n  --dsh-sh-crack: rgba(200, 214, 226, 0.22);\n  --dsh-sh-pit: rgba(168, 182, 196, 0.28);\n}\n[data-ds-dark-theme] .dsh-sh__mark[data-material=\"gold\"] {\n  --dsh-sh-metal-0: #e8d38a;\n  --dsh-sh-metal-1: #c2a548;\n  --dsh-sh-metal-2: #8d722a;\n  --dsh-sh-metal-3: #574314;\n  --dsh-sh-metal-4: #1f1704;\n  --dsh-sh-field: #241d0c;\n  --dsh-sh-lip: rgba(255, 238, 180, 0.26);\n  --dsh-sh-crack: rgba(222, 192, 116, 0.26);\n  --dsh-sh-pit: rgba(190, 160, 90, 0.3);\n}\n\n/* --- the device is the material --------------------------------------------\n   The stops are *defined as* metal stops, not as a second palette that happens\n   to agree: whatever the plate's bevel is made of, the symbol stamped into it is\n   made of the same thing. Custom properties are substituted where they are used,\n   so these references resolve against the material block on the same element and\n   the two can never drift apart.\n\n   The light cut takes the darker half of the ramp (the motif has to read against\n   a pale field); the dark cut takes the brighter half (against a dark one). */\n.dsh-sh__mark {\n  --dsh-sh-device-0: var(--dsh-sh-metal-1);\n  --dsh-sh-device-1: var(--dsh-sh-metal-2);\n  --dsh-sh-device-2: var(--dsh-sh-metal-3);\n  --dsh-sh-device-3: var(--dsh-sh-metal-4);\n  --dsh-sh-ink: var(--dsh-sh-metal-1);\n}\n[data-ds-dark-theme] .dsh-sh__mark {\n  --dsh-sh-device-0: var(--dsh-sh-metal-0);\n  --dsh-sh-device-1: var(--dsh-sh-metal-1);\n  --dsh-sh-device-2: var(--dsh-sh-metal-2);\n  --dsh-sh-device-3: var(--dsh-sh-metal-3);\n}\n\n/* The plate's own outline, and the milled edge of a struck medal. */\n.dsh-sh__mark .dsh-sh__edge {\n  stroke: rgba(24, 18, 6, 0.85);\n}\n.dsh-sh__mark .dsh-sh__mill {\n  stroke: rgba(255, 246, 222, 0.34);\n}\n[data-ds-dark-theme] .dsh-sh__mark .dsh-sh__edge {\n  stroke: rgba(0, 0, 0, 0.72);\n}\n[data-ds-dark-theme] .dsh-sh__mark .dsh-sh__mill {\n  stroke: rgba(255, 240, 205, 0.2);\n}\n\n/* The recessed field is the **material's**, and nothing else's.\n   An experiment tinted it per device (a covenant-colour enamel: amber sun, blue\n   moon, green wolf) to follow Dark Souls III's colour-coded covenant emblems. It\n   read well, but it made the badge's *background* change when the user only meant\n   to change the figure — so the device now decides the figure and the material\n   decides everything around it. If the enamel comes back, it comes back as a\n   setting, not as a side effect of picking a motif. */\n\n/* Recessed field, its fractures, its pitting, and the device inside it. */\n.dsh-sh__mark .dsh-sh__field {\n  fill: var(--dsh-sh-field, #efe6cf);\n}\n.dsh-sh__mark .dsh-sh__lip {\n  stroke: var(--dsh-sh-lip, rgba(255, 245, 220, 0.5));\n}\n.dsh-sh__mark .dsh-sh__cracks {\n  stroke: var(--dsh-sh-crack, rgba(132, 104, 58, 0.42));\n}\n.dsh-sh__mark .dsh-sh__pits {\n  fill: var(--dsh-sh-pit, rgba(110, 86, 46, 0.4));\n}\n\n/* --- the device ------------------------------------------------------------\n   Everything the device draws is repainted from the metal, whatever the upload\n   said its colours were. That is the whole \"blend into the badge\" contract, and\n   it is enforced here rather than by trusting the file:\n\n   - a *filled* shape (a normalized upload marks it `fill=\"currentColor\"`) gets\n     the device gradient, so it picks up the plate's own light direction;\n   - *line art* (`fill=\"none\"` plus a stroke) stays line art — filling it would\n     turn a drawn outline into a blob — but it is struck from the same metal;\n   - the catch-all covers anything a hand-edited file left without a fill at\n     all, which would otherwise render as a black silhouette leaking through\n     the metal.\n\n   Scoped to `#dsh-souls-hud` on purpose. These rules name the live mark's\n   gradient **by id**, and SVG ids are document-global: a second medallion on the\n   page — the settings form's preview — would resolve `url(#dsh-sh-device)` to\n   the live mark's gradient and show the wrong metal. The preview therefore draws\n   its own, uniquely-identified gradients and is deliberately outside these\n   rules. (Found the hard way: the devices × metals gallery rendered four\n   identical metals.) */\n#dsh-souls-hud .dsh-sh__mark .dsh-sh__device {\n  color: var(--dsh-sh-ink, #cba96c);\n  filter: drop-shadow(0 0.7px 0.6px rgba(18, 12, 2, 0.75));\n}\n#dsh-souls-hud .dsh-sh__mark .dsh-sh__device :is(path, polygon, polyline, circle, ellipse, rect, text, tspan) {\n  fill: url(#dsh-sh-device);\n}\n#dsh-souls-hud .dsh-sh__mark .dsh-sh__device [fill=\"none\"] {\n  fill: none;\n  stroke: url(#dsh-sh-device);\n}\n#dsh-souls-hud .dsh-sh__mark .dsh-sh__device [stroke=\"currentColor\"] {\n  stroke: url(#dsh-sh-device);\n}\n#dsh-souls-hud .dsh-sh__mark .dsh-sh__device line {\n  fill: none;\n  stroke: url(#dsh-sh-device);\n}\n\n/* --- the burn gauge and the tariff window ------------------------------------\n   Two signals, two channels, so neither can hide the other:\n\n   - the **length** of the lit arc along the milled edge is how fast tokens are\n     being spent right now (`renderBurn` re-points the path; it runs exactly on\n     the beaded rim, so what lights up is the medal's own edge);\n   - its **colour** is the tariff window that spending falls in — amber on peak\n     hours, cool blue off-peak, neutral when the reading is switched off.\n\n   The coarse `data-burn` level (0–4) drives how insistent the arc looks, and the\n   top level breathes. */\n.dsh-sh__mark .dsh-sh__gauge {\n  stroke: rgba(255, 246, 222, 0.62);\n  stroke-width: 1.5;\n  opacity: 0.85;\n  /* The gauge is one full-length path whose visible arc is a dash: the fill is\n     `stroke-dashoffset`, which CSS can animate. Rewriting the path's `d` on every\n     poll — the first implementation — cannot be transitioned and snapped. */\n  transition: stroke-dashoffset 1200ms cubic-bezier(0.25, 0.8, 0.3, 1),\n    stroke 600ms linear, opacity 400ms linear;\n}\n.dsh-sh__mark[data-tariff=\"peak\"] .dsh-sh__gauge {\n  stroke: #ffc46a;\n  filter: drop-shadow(0 0 1.4px rgba(255, 166, 60, 0.75));\n}\n.dsh-sh__mark[data-tariff=\"offpeak\"] .dsh-sh__gauge {\n  stroke: #9fe3ff;\n  filter: drop-shadow(0 0 1.4px rgba(120, 210, 255, 0.75));\n}\n.dsh-sh__mark[data-burn=\"2\"] .dsh-sh__gauge {\n  stroke-width: 1.7;\n  opacity: 0.95;\n}\n.dsh-sh__mark[data-burn=\"3\"] .dsh-sh__gauge {\n  stroke-width: 1.9;\n  opacity: 1;\n  filter: drop-shadow(0 0 2.2px currentColor);\n}\n.dsh-sh__mark[data-burn=\"4\"] .dsh-sh__gauge {\n  stroke-width: 2.1;\n  opacity: 1;\n  filter: drop-shadow(0 0 2.6px rgba(255, 180, 90, 0.85));\n  animation: dsh-sh-ember 1.8s ease-in-out infinite;\n}\n/* The ember breathes at the top level; the arc itself stays put. */\n@keyframes dsh-sh-ember {\n  0%,\n  100% {\n    opacity: 0.78;\n  }\n  50% {\n    opacity: 1;\n  }\n}\n\n/* The settings form's preview: a real medallion, drawn standalone. Its own metal\n   is baked into the markup (see `previewSvg`), so it only needs the box. */\n.dsh-sh__mark[data-preview] {\n  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));\n}\n\n\n/* The three bars, stacked. */\n.dsh-sh__stack {\n  display: flex;\n  flex-direction: column;\n  gap: var(--dsh-sh-gap);\n  min-width: 0;\n}\n\n/* --- the numeric readouts ------------------------------------------------ */\n/* Hidden with opacity rather than by unmounting, so the bars keep their length\n   and nothing reflows when the pointer arrives. */\n.dsh-sh--numbers-hover .dsh-sh__read,\n.dsh-sh--numbers-hidden .dsh-sh__read {\n  opacity: 0;\n  transition: opacity 0.14s ease;\n}\n/* Hover mode needs the pointer, which the click-through cluster otherwise\n   ignores. The box covers the sidebar's brand row, where nothing is clickable,\n   so taking it back costs nothing. */\n#dsh-souls-hud.dsh-sh--numbers-hover {\n  pointer-events: auto;\n}\n#dsh-souls-hud.dsh-sh--numbers-hover:hover .dsh-sh__read {\n  opacity: 1;\n}\n\n/* --- one vitals row -------------------------------------------------------- */\n.dsh-sh__row {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  margin: 0;\n}\n\n/* The wallet rows are the one interactive part: the cluster is click-through\n   everywhere else, so a tap on HP or FP opens Settings. */\n.dsh-sh__row--action {\n  pointer-events: auto;\n  cursor: pointer;\n}\n.dsh-sh__row--action:hover .dsh-sh__fill {\n  filter: brightness(1.25);\n}\n\n/* Per-bar palette. DS vitals: crimson HP, deep-blue FP, yellow-green stamina.\n   All three share the one measured width, so they are always the same length. */\n.dsh-sh__row[data-kind=\"hp\"] {\n  --dsh-sh-c1: #c94a3c;\n  --dsh-sh-c2: #8d150c;\n  --dsh-sh-c3: #330401;\n  --dsh-sh-glow: rgba(232, 48, 28, 0.42);\n  --dsh-sh-tint: #dda294;\n}\n.dsh-sh__row[data-kind=\"fp\"] {\n  --dsh-sh-c1: #5b90dd;\n  --dsh-sh-c2: #1e4699;\n  --dsh-sh-c3: #061138;\n  --dsh-sh-glow: rgba(56, 116, 235, 0.42);\n  --dsh-sh-tint: #9fbde8;\n}\n.dsh-sh__row[data-kind=\"sp\"] {\n  --dsh-sh-c1: #9dc44e;\n  --dsh-sh-c2: #5f8815;\n  --dsh-sh-c3: #1a2c04;\n  --dsh-sh-glow: rgba(128, 196, 44, 0.4);\n  --dsh-sh-tint: #c4d894;\n}\n\n/* --- the metal rim + the recessed socket ----------------------------------- */\n.dsh-sh__shell {\n  position: relative;\n  flex: 0 0 auto;\n  width: var(--dsh-sh-width);\n  height: var(--dsh-sh-h);\n  padding: 1px;\n  box-sizing: border-box;\n  border-radius: 3px;\n  /* Warm engraved-metal hairline, brightest along the top edge. */\n  background: linear-gradient(\n    180deg,\n    rgba(214, 190, 138, 0.5) 0%,\n    rgba(140, 120, 76, 0.26) 42%,\n    rgba(46, 39, 24, 0.5) 100%\n  );\n  filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.7));\n}\n\n.dsh-sh__socket {\n  position: relative;\n  width: 100%;\n  height: 100%;\n  overflow: hidden;\n  border-radius: 2px;\n  /* Recess: a warm lip at the top, near-black through the body, dead at the\n     base. Never pure black — the empty track must still read as a surface. */\n  background: linear-gradient(\n    180deg,\n    #221d16 0%,\n    #16120d 38%,\n    #0c0a08 68%,\n    #050404 100%\n  );\n  box-shadow: inset 0 1px 0 rgba(255, 246, 222, 0.1),\n    inset 0 -1px 2px rgba(0, 0, 0, 0.85), inset 0 0 5px rgba(0, 0, 0, 0.7);\n}\n\n/* Fine vertical grain — the \"grit\" that keeps the bars from looking flat. */\n.dsh-sh__socket::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  background-image: repeating-linear-gradient(\n      90deg,\n      rgba(255, 255, 255, 0.03) 0px,\n      rgba(255, 255, 255, 0.03) 1px,\n      rgba(0, 0, 0, 0.04) 1px,\n      rgba(0, 0, 0, 0.04) 4px\n    ),\n    linear-gradient(\n      104deg,\n      rgba(255, 255, 255, 0.035) 0%,\n      rgba(255, 255, 255, 0) 34%,\n      rgba(0, 0, 0, 0.06) 70%,\n      rgba(0, 0, 0, 0) 100%\n    );\n  mix-blend-mode: overlay;\n  opacity: 0.6;\n}\n\n/* --- the pale \"just lost / just gained\" trail ------------------------------ */\n.dsh-sh__ghost {\n  position: absolute;\n  left: 0;\n  top: 1px;\n  bottom: 1px;\n  width: 0%;\n  border-radius: 1.5px;\n  background: linear-gradient(\n    180deg,\n    rgba(255, 250, 238, 0.92) 0%,\n    rgba(246, 228, 198, 0.78) 55%,\n    rgba(206, 176, 132, 0.7) 100%\n  );\n  transition: width 620ms cubic-bezier(0.33, 0, 0.2, 1);\n}\n\n/* --- the value fill -------------------------------------------------------- */\n.dsh-sh__fill {\n  position: absolute;\n  left: 0;\n  top: 1px;\n  bottom: 1px;\n  width: 0%;\n  border-radius: 1.5px;\n  /* A specular wash over a hard vertical fall-off: bright lip, blood-dark base. */\n  background: linear-gradient(\n      180deg,\n      rgba(255, 255, 255, 0.15) 0%,\n      rgba(255, 255, 255, 0) 20%\n    ),\n    linear-gradient(\n      180deg,\n      var(--dsh-sh-c1) 0%,\n      var(--dsh-sh-c2) 36%,\n      var(--dsh-sh-c2) 58%,\n      var(--dsh-sh-c3) 100%\n    );\n  box-shadow: 0 0 5px var(--dsh-sh-glow), inset 0 -1px 1px rgba(0, 0, 0, 0.6),\n    inset 0 1px 0 rgba(255, 255, 255, 0.07);\n  transition: width var(--dsh-sh-ease) cubic-bezier(0.22, 0.61, 0.36, 1);\n}\n\n/* Glassy top edge + a brighter leading meniscus at the fill's right end. */\n.dsh-sh__fill::after {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  right: 0;\n  top: 0;\n  height: 1px;\n  background: rgba(255, 255, 255, 0.26);\n}\n.dsh-sh__fill::before {\n  content: \"\";\n  position: absolute;\n  right: 0;\n  top: 0;\n  bottom: 0;\n  width: 1px;\n  background: rgba(255, 255, 255, 0.16);\n  box-shadow: 0 0 3px rgba(255, 255, 255, 0.12);\n}\n\n/* Critical state: the vitals pulse the way they do when you are about to die. */\n.dsh-sh__row.is-critical .dsh-sh__fill {\n  animation: dsh-sh-pulse 1.5s ease-in-out infinite;\n}\n@keyframes dsh-sh-pulse {\n  0%,\n  100% {\n    filter: brightness(1);\n    box-shadow: 0 0 4px var(--dsh-sh-glow);\n  }\n  50% {\n    filter: brightness(1.35);\n    box-shadow: 0 0 10px var(--dsh-sh-glow), 0 0 18px var(--dsh-sh-glow);\n  }\n}\n\n/* A freshly changed bar flashes, then settles. */\n.dsh-sh__row.is-changed .dsh-sh__fill {\n  animation: dsh-sh-flash 620ms ease-out 1;\n}\n@keyframes dsh-sh-flash {\n  0% {\n    filter: brightness(1.7);\n  }\n  100% {\n    filter: brightness(1);\n  }\n}\n\n/* Unknown value: the socket stays cold and empty. */\n.dsh-sh__row.is-unknown .dsh-sh__fill,\n.dsh-sh__row.is-unknown .dsh-sh__ghost {\n  width: 0% !important;\n}\n\n/* --- engraved readouts ----------------------------------------------------- */\n.dsh-sh__read {\n  display: flex;\n  align-items: baseline;\n  gap: 4px;\n  /* One fixed column, so every bar ends at the same place. */\n  min-width: 46px;\n  font-size: 10px;\n  line-height: 1;\n  white-space: nowrap;\n  color: var(--dsh-sh-ink);\n  letter-spacing: 0.02em;\n  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.8);\n}\n.dsh-sh__read .dsh-sh__value {\n  font-weight: 600;\n  font-variant-numeric: tabular-nums;\n  color: var(--dsh-sh-tint);\n}\n.dsh-sh__read .dsh-sh__detail {\n  font-style: normal;\n  font-size: 9px;\n  opacity: 0.55;\n  font-variant-numeric: tabular-nums;\n}\n\n/* Light theme: the app marks dark mode on <body>, so the readouts flip to dark\n   ink with a light rim instead of parchment over a dark halo. The bars\n   themselves always stay dark — a Dark Souls HUD does not go pastel. */\nbody:not([data-ds-dark-theme]) .dsh-sh__read {\n  color: #4a4234;\n  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8), 0 0 4px rgba(255, 255, 255, 0.7);\n}\nbody:not([data-ds-dark-theme]) .dsh-sh__read .dsh-sh__value {\n  filter: brightness(0.58) saturate(1.2);\n}\nbody:not([data-ds-dark-theme]) .dsh-sh__read .dsh-sh__detail {\n  opacity: 0.66;\n}\n\n/* Respect a user who asked for less motion. */\n@media (prefers-reduced-motion: reduce) {\n  #dsh-souls-hud,\n  .dsh-sh__fill,\n  .dsh-sh__ghost {\n    transition: none !important;\n  }\n  .dsh-sh__row.is-critical .dsh-sh__fill,\n  .dsh-sh__row.is-changed .dsh-sh__fill,\n  .dsh-sh__mark[data-burn=\"4\"] .dsh-sh__gauge {\n    animation: none !important;\n  }\n}\n";</script>
<script>/* ============================================================================
 * BuilderHUD — the Souls HUD renderer.
 *
 * Plain script, no module system: it is pulled into index.html by the host
 * half's `tapIndex` transform, and loaded on demand by `lib/client.js` when the
 * plugin is mounted through the client module graph instead. It owns the DOM,
 * polls the host for vitals and animates the bars. Everything is click-through.
 *

 * handle: truthy means it is running, `.destroy()` tears it down (used by the
 * client half's effect disposer), `.refresh()` forces a poll, and
 * `.previewSvg({ device, shape, material, custom, gauge, dark })` renders a
 * standalone medallion, `.previewCells(...)` renders the settings form's four-cell

 * on a picked file before it sends it.

 * (`__DSH_SOULS_HUD_LOCALE__`) — so the few strings the HUD itself draws follow

    { kind: "fp", label: "FP", action: "settings", actionTitleKey: "row.balanceTitle" },
    { kind: "sp", label: "SP", action: "context", actionTitleKey: "row.contextTitle" },
  ];

   * The HUD's own strings, for the one case where the client half never ran:

   * not a dictionary the app has to agree with.

    en: {
      "row.balanceTitle": "Open Settings to see the balance",
      "row.contextTitle": "Show the context readout",
      "balance.signedOut": "signed out",
      "balance.unavailable": "unavailable",
      "context.noSession": "no session",
    },
    zh: {
      "row.balanceTitle": "打开设置查看余额",
      "row.contextTitle": "查看 context 占用",
      "balance.signedOut": "未登录",
      "balance.unavailable": "不可用",

    pollMs: 15000,
    barWidth: 96,
    scale: 1,

    anchor: "sidebar",
    gapX: 10,
    gapY: 10,
    offsetX: 20,
    offsetY: 40,
    showText: true,
    // 'always' | 'hover' | 'hidden' — what the settings form writes.
    numbers: "always",
    // 'remaining' (a pool that is left) | 'used'.
    staminaMode: "remaining",
    // What the medallion is struck with: whale | hammer | sword | sun | moon |
    // custom (the SVG the user uploaded).
    device: "whale",
    // The plate's silhouette: 'round' is the covenant medal, 'octagon' the
    // cut-corner plate this plugin shipped first.

    idleDimMs: 0,

  /** Silhouettes the plate can be cut to. */

  /**

    /** A whale: a rounded body, a raised fluke, and a cut-out eye. */

        '<path fill-rule="evenodd" clip-rule="evenodd" d="M32.4 315.2C-1.97882 215.09 65.3247 114.942 205.044 153.389C259.611 168.405 310.779 237.698 353.019 233.577C395.26 229.456 407.568 206.481 410.021 189.681C412.475 172.881 372.058 165.64 372.058 135.593C379.438 141.919 408.664 140.161 418.797 143.275C428.076 146.126 431.624 151.034 431.624 153.926C431.624 149.803 434.474 146.38 444.275 143.275C453.061 140.112 484.945 143.093 494.147 139.372C491.621 179.316 448.731 171.283 442.522 194.962C433.624 228.899 438.151 251.957 433.624 279.432C429.325 305.52 423.755 320.788 413.021 337.713C404.383 351.334 381.545 369.331 349.075 383.691C316.606 398.051 230.28 409.558 155.6 403.2C80.9203 396.843 47.4704 359.085 32.4 315.2ZM165.2 252.8C160.32 252.8 155.64 254.739 152.189 258.19C148.739 261.64 146.8 266.32 146.8 271.2C146.8 276.08 148.739 280.76 152.189 284.211C155.64 287.662 160.32 289.6 165.2 289.6C170.08 289.6 174.76 287.662 178.211 284.211C181.661 280.76 183.6 276.08 183.6 271.2C183.6 266.32 181.661 261.64 178.211 258.19C174.76 254.739 170.08 252.8 165.2 252.8Z" fill="currentColor"/>'

        '<path d="M286.844 458.074H223.631V192.532H286.844V458.074ZM415.513 174.255H88.9971V107.074L141.622 55.0703H415.513V174.255Z" fill="currentColor"/>'

  function findBrandMark(sidebar) {
    var bySlot = findLaidOut(BRAND_MARK_SLOT, sidebar.node);
    if (bySlot) return bySlot;
    // The mark may be an inline SVG or an <img>. Take the left-most candidate
    // in the sidebar's top band, ignoring anything inside a control — the
    // sidebar's collapse button sits at the top *right* and must never win.
    var candidates = sidebar.node.querySelectorAll("svg,img");
    var best = null;
    for (var i = 0; i < candidates.length; i += 1) {
      var node = candidates[i];
      if (node.closest && node.closest("button")) continue;
      var rect = visibleRect(node);
      if (!rect) continue;
      if (rect.top - sidebar.rect.top > 100) continue;
      if (rect.width < 12 || rect.height < 12) continue;
      if (!best || rect.left < best.rect.left) best = { node: node, rect: rect };
    }
    return best;
  }

  /**
   * Locate the brand row and fit the cluster into the space right of the whale.
   *
   * The bars take whatever width is left once the mark, the readout column and
   * a right inset are reserved, so the row always looks deliberate rather than
   * sized by guesswork.
   *
   * @returns {x, y, width} in viewport pixels, or null when the sidebar or its
   * brand row is not on screen (a collapsed layout, or the blank hero).
   */
  function sidebarAnchor() {
    var sidebar = findLaidOut('[class*="sidebarCol"]');
    if (!sidebar) return null;
    var brandMark = findBrandMark(sidebar);
    if (!brandMark) return null;
    hideBrandRow(brandMark.rect, sidebar.node);

    // The cluster draws its own mark at the row's left inset, so x is the row's
    // own start rather than the end of the app's mark.
    var x = Math.round(brandMark.rect.left);
    var stackHeight = 3 * BAR_H + 2 * ROW_GAP;
    var y = Math.round(
      brandMark.rect.top + (brandMark.rect.height - stackHeight) / 2,
    );

    // Everything the row gives up before the bars take their share.
    var LOGO_W = 20;
    var LOGO_GAP = 9;
    // A permanently hidden readout does not need its column, so the bars take it.
    var READOUT_W = config.numbers === "hidden" ? 0 : 44;
    var ROW_GAP_PX = config.numbers === "hidden" ? 0 : 6;
    var RIGHT_INSET = 14;
    var width =
      sidebar.rect.right - RIGHT_INSET - x - LOGO_W - LOGO_GAP - READOUT_W - ROW_GAP_PX;
    width = Math.max(48, Math.min(240, Math.round(width)));
    return { x: x, y: y, width: width };
  }

  /** Keep the cluster inside the viewport, whatever the layout reported. */
  function clampToViewport(x, y) {
    var minX = config.anchor === "sidebar" ? 6 : 88;
    return {
      x: Math.min(Math.max(x, minX), Math.max(minX, window.innerWidth - 140)),
      y: Math.min(Math.max(y, 0), Math.max(0, window.innerHeight - 80)),
    };
  }

  /** Place the cluster; re-run whenever the layout may have moved. */
  function positionHud() {
    if (!root) return;
    // Self-heal the one failure that ruins the whole page: a mount without its
    // stylesheet is in normal document flow, so it lands at the bottom of the
    // app and drags it into a scrollbar. `styled` is true while an attempt is in
    // flight and false once it has given up, so this only restarts a chain that
    // has actually stopped.
    if (!styleReady && !styled) {
      styled = true;
      styleAttempt(0, function () {});
    }
    // Switching sessions must move the stamina bar now, not at the next 15s
    // poll: this timer already runs every 600ms, and the comparison is a string.
    if (shownSessionId() !== lastSessionId) poll();
    var x = config.offsetX;
    var y = config.offsetY;
    var width = config.barWidth;
    if (config.anchor === "sidebar") {
      var fit = sidebarAnchor();
      if (fit) {
        x = fit.x;
        y = fit.y;
        width = fit.width;
      }
    } else if (config.anchor === "chat") {
      var anchored = chatAnchor();
      if (anchored) {
        x = anchored.x;
        y = anchored.y;
      }
    }
    var placed = clampToViewport(x, y);
    root.style.setProperty("--dsh-sh-x", Math.round(placed.x) + "px");
    root.style.setProperty("--dsh-sh-y", Math.round(placed.y) + "px");
    root.style.setProperty("--dsh-sh-width", Math.round(width) + "px");
    sizeMarkToBars();
  }

  /**
   * Match the medallion's height to the bars' container.
   *
   * The two sit side by side, and the medallion reads as a companion to the
   * bars only if it is exactly as tall as they are — so its size is measured
   * rather than guessed, and it follows any change to bar height or spacing.
   */
  function sizeMarkToBars() {
    if (!mark || !stack) return;
    var height = Math.round(stack.getBoundingClientRect().height);
    if (height < 8 || height === markSize) return;
    markSize = height;
    mark.style.width = height + "px";
    mark.style.height = height + "px";
  }

  /**
   * Tell the host how this actually landed: the resolved offset, the rect the
   * cluster really occupies, and what element sits on top at that point. The
   * host cannot see any of this, and every one of them is a distinct failure
   * mode (never mounted / placed off-screen / covered by the app).
   * @param tag - which lifecycle moment this report is from.
   */
  function report(tag) {
    if (!root) return;
    var payload;
    try {
      payload = buildPayload(tag);
    } catch (error) {
      // Diagnostics must never die silently — and this one is called from a
      // promise callback, where a throw becomes an unhandled rejection that no
      // window.onerror handler can see. So a snapshot that cannot be built is
      // reported *as* the snapshot.
      payload = { tag: tag, snapshotError: String((error && error.stack) || error) };
    }
    try {
      fetch(BASE + "/beacon", {
        method: "POST",
        keepalive: true,
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      }).catch(function () {});
    } catch (error) {
      /* nothing left to try */
    }
  }

  /** Build the snapshot. Isolated so a throw can never lose the beacon. */
  function buildPayload(tag) {
    var rect = root.getBoundingClientRect();
    var column = findLaidOut('[class*="centerCol"]');
    var header = null;
    if (column) {
      var headers = column.node.querySelectorAll('[class*="_header"]');
      for (var i = 0; i < headers.length; i += 1) {
        var candidate = visibleRect(headers[i]);
        if (candidate) {
          header = {
            cls: String(headers[i].className).slice(0, 60),
            top: Math.round(candidate.top),
            bottom: Math.round(candidate.bottom),
            w: Math.round(candidate.width),
          };
          break;
        }
      }
    }
    var onTop = null;
    try {
      var probe = document.elementFromPoint(rect.left + 6, rect.top + 6);
      onTop = probe ? String(probe.id || probe.className || probe.tagName).slice(0, 60) : null;
    } catch {
      onTop = "elementFromPoint-threw";
    }
    return {
      tag: tag,
      viewport: [window.innerWidth, window.innerHeight],
      guard: Boolean(window.__DSH_SOULS_HUD__),
      rows: root.children.length,
      rect: {
        x: Math.round(rect.x),
        y: Math.round(rect.y),
        w: Math.round(rect.width),
        h: Math.round(rect.height),
      },
      css: {
        left: getComputedStyle(root).left,
        top: getComputedStyle(root).top,
        opacity: getComputedStyle(root).opacity,
        zIndex: getComputedStyle(root).zIndex,
        position: getComputedStyle(root).position,
        display: getComputedStyle(root).display,
        visibility: getComputedStyle(root).visibility,
      },
      column: column
        ? { left: Math.round(column.rect.left), top: Math.round(column.rect.top), w: Math.round(column.rect.width), cls: String(column.node.className).slice(0, 60) }
        : null,
      header: header,
      onTop: onTop,
      bodyChild: root.parentNode === document.body,
      settingsTrigger: findSettingsTrigger() !== null,
      lastStandDown: (function () {
        try {
          var raw = localStorage.getItem("dsh-sh-standdown");
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          return null;
        }
      })(),
      brandRow: (function () {
        function vis(selector) {
          var el = document.querySelector(selector);
          if (!el) return "absent";
          var r = el.getBoundingClientRect();
          return {
            visibility: getComputedStyle(el).visibility,
            w: Math.round(r.width),
            h: Math.round(r.height),
            text: (el.textContent || "").trim().slice(0, 18),
          };
        }
        return {
          mark: vis('[data-slot="sidebar.brand.mark"]'),
          name: vis('[data-slot="sidebar.brand.name"]'),
        };
      })(),
      contextMeter: (function () {
        var meter = findContextMeter();
        return meter
          ? { text: (meter.node.textContent || "").trim(), top: Math.round(meter.rect.top) }
          : null;
      })(),
      markDrawn: Boolean(mark && mark.parentNode),
      // What the badge is currently made of, and whether an uploaded device is
      // actually in hand — a `custom` setting with no usable file falls back to
      // the built-in mark, and that has to be visible from `/health`.
      badge: {
        device: paintedDevice,
        material: paintedMaterial,
        shape: paintedShape,
        custom: customDeviceState,
        tariff: lastTariff,
        burn: {
          ratio: Math.round(lastBurn.ratio * 1000) / 1000,
          level: lastBurn.level,
          tokensPerMin: lastBurn.tokensPerMin,
        },
      },
      // Which session the stamina bar is describing. `/health` then always says
      // what the bar means, and it is the only way to tell "the host has no
      // context for the shown session" from "the bar is stale".
      session: shownSessionId(),
    };
  }

  /** Apply the host-supplied appearance configuration. */
  function applyConfig(next) {
    if (!next) return;
    config = {
      pollMs: Math.max(1000, Number(next.pollMs) || defaults.pollMs),
      barWidth: Math.max(80, Number(next.barWidth) || defaults.barWidth),
      scale: Number(next.scale) || 1,
      anchor:
        next.anchor === "frame" || next.anchor === "chat"
          ? next.anchor
          : defaults.anchor,
      gapX: isFinite(Number(next.gapX)) ? Number(next.gapX) : defaults.gapX,
      gapY: isFinite(Number(next.gapY)) ? Number(next.gapY) : defaults.gapY,
      offsetX: isFinite(Number(next.offsetX)) ? Number(next.offsetX) : defaults.offsetX,
      offsetY: isFinite(Number(next.offsetY)) ? Number(next.offsetY) : defaults.offsetY,
      showText: next.showText !== false,
      numbers:
        next.numbers === 'hover' || next.numbers === 'hidden' ? next.numbers : 'always',
      staminaMode: next.staminaMode === 'used' ? 'used' : 'remaining',
      // Customization travels with the rest of the config, but note the trap the
      // previous author hit: this object is rebuilt from an explicit field list,
      // so a key added to `defaults` and to the host alone would never arrive.
      device: DEVICES.indexOf(next.device) === -1 ? defaults.device : next.device,
      material: MATERIALS.indexOf(next.material) === -1 ? defaults.material : next.material,
      shape: SHAPES.indexOf(next.shape) === -1 ? defaults.shape : next.shape,
      idleDimMs: Math.max(0, Number(next.idleDimMs) || 0),
      criticalPercent:
        typeof next.criticalPercent === "number"
          ? next.criticalPercent
          : defaults.criticalPercent,
    };
    root.style.setProperty("--dsh-sh-scale", String(config.scale));
    // The readouts are hidden with the class, not by unmounting them, so the
    // bars keep their length and nothing reflows when the pointer arrives.
    root.classList.toggle("dsh-sh--numbers-hover", config.numbers === "hover");
    root.classList.toggle("dsh-sh--numbers-hidden", config.numbers === "hidden");
    // The medallion: draw the chosen device, in the chosen metal. A `custom`
    // device needs its file first, so the fetch is kicked off and the mark
    // repaints when it lands (and falls back to the built-in mark until then).
    paintMark();
    if (config.device === "custom") {
      var stamp = next.customDevice && next.customDevice.present ? next.customDevice.updatedAt : 0;
      loadCustomDevice(stamp || 0);
    }
    positionHud();
    for (var i = 0; i < ROWS.length; i += 1) {
      var read = rows[ROWS[i].kind].value.parentNode;
      read.style.display = config.showText ? "" : "none";
    }
    if (pollTimer && config.pollMs !== activePollMs) {
      clearInterval(pollTimer);
      activePollMs = config.pollMs;
      pollTimer = setInterval(function () {
        poll();
      }, activePollMs);
    }
  }

  /** Remember that something moved, so the HUD stays bright for a while. */
  function markActive() {
    root.classList.add("dsh-sh--active");
    root.classList.remove("dsh-sh--dim");
    if (idleTimer) clearTimeout(idleTimer);
    if (config.idleDimMs > 0) {
      idleTimer = setTimeout(function () {
        root.classList.remove("dsh-sh--active");
        root.classList.add("dsh-sh--dim");
      }, config.idleDimMs);
    }
  }

  /**
   * Drive one bar.
   * @param kind - row key.
   * @param ratio - 0..1 fraction, or null when unknown.
   * @param valueText - primary readout.
   * @param detailText - secondary readout.
   */
  function setBar(kind, ratio, valueText, detailText) {
    var bar = rows[kind];
    if (!bar) return;
    bar.value.textContent = valueText;
    bar.detail.textContent = detailText || "";

    if (ratio === null || typeof ratio !== "number" || !isFinite(ratio)) {
      bar.row.classList.add("is-unknown");
      bar.row.classList.remove("is-critical");
      return;
    }
    bar.row.classList.remove("is-unknown");

    var next = clamp01(ratio);
    var prev = lastRatio[kind];
    var changed = bar.painted && Math.abs(next - prev) > 0.0005;

    // The pale trail only means something when vitals were lost.
    if (next < prev - 0.0005) {
      bar.ghost.style.transition = "none";
      bar.ghost.style.width = pct(prev);
      // Force a reflow so the frozen width commits before it animates down.
      void bar.ghost.offsetWidth;
      bar.ghost.style.transition = "";
      bar.fill.style.width = pct(next);
      if (bar.timer) clearTimeout(bar.timer);
      bar.timer = setTimeout(function () {
        bar.ghost.style.width = pct(next);
      }, 320);
    } else {
      bar.ghost.style.transition = "none";
      bar.ghost.style.width = pct(next);
      void bar.ghost.offsetWidth;
      bar.ghost.style.transition = "";
      bar.fill.style.width = pct(next);
    }

    lastRatio[kind] = next;

    if (next * 100 <= config.criticalPercent) bar.row.classList.add("is-critical");
    else bar.row.classList.remove("is-critical");

    if (changed) {
      bar.row.classList.remove("is-changed");
      void bar.row.offsetWidth;
      bar.row.classList.add("is-changed");
    }
    bar.painted = true;
    return changed;
  }

  /**
   * Point the burn gauge at a new fraction, in place.
   *
   * The gauge is one `<path>`; re-rendering the medallion on every poll would
   * throw away the DOM for a number that changes constantly, so only the `d`
   * attribute moves.
   *
   * @param ratio - 0..1 of the medal's edge to light up.
   */
  function paintGauge(ratio) {
    if (!mark) return;
    var path = mark.querySelector(".dsh-sh__gauge");
    if (!path) return;
    var next = gaugeAttributes(paintedShape, ratio);
    // The path itself never changes; only the dash slides, which is what the
    // stylesheet's transition can animate.
    if (path.getAttribute("stroke-dasharray") !== next.dasharray) {
      path.setAttribute("stroke-dasharray", next.dasharray);
    }
    path.setAttribute("stroke-dashoffset", next.dashoffset);
  }

  /**
   * Apply the host's burn and tariff reading to the badge.
   *
   * Two signals, two channels, so neither hides the other: the **length** of the
   * lit arc along the medal's milled edge is how fast tokens are being spent
   * right now, and its **colour** is which tariff window that spending falls in
   * (amber on peak hours, cool blue off-peak).
   *
   * @param state - the `/state.json` payload.
   */
  function renderBurn(state) {
    var burn = state.burn || {};
    var tariff = state.tariff || {};
    var ratio = typeof burn.ratio === "number" && isFinite(burn.ratio) ? clamp01(burn.ratio) : 0;
    var level = typeof burn.level === "number" && isFinite(burn.level) ? Math.max(0, Math.min(4, Math.round(burn.level))) : 0;
    lastBurn = {
      available: burn.available === true,
      ratio: ratio,
      level: level,
      tokensPerMin: typeof burn.tokensPerMin === "number" ? burn.tokensPerMin : null,
      outputTokensPerMin: typeof burn.outputTokensPerMin === "number" ? burn.outputTokensPerMin : null,
      cacheTokensPerMin: typeof burn.cacheTokensPerMin === "number" ? burn.cacheTokensPerMin : null,
      fullScaleTpm: Number(burn.fullScaleTpm) || Number(config.burnFullScaleTpm) || 0,
    };
    lastTariff =
      tariff.enabled === false ? "off" : tariff.peak === true ? "peak" : tariff.peak === false ? "offpeak" : "off";
    if (!mark) return;
    mark.setAttribute("data-burn", String(level));
    mark.setAttribute("data-tariff", lastTariff);
    paintGauge(ratio);
  }

  /** Paint one `/state.json` payload. */
  function render(state) {
    var moved = false;
    renderBurn(state);

    var balance = state.balance || {};
    var context = state.context || {};
    // What the bars are showing, kept for the settings form: it shows the live
    // numbers beside the caps and the context mode, so a cap is a decision about
    // something visible rather than a number in the abstract.
    lastLive = {
      balance: {
        available: Boolean(balance.available),
        currency: balance.currency === "USD" ? "USD" : "CNY",
        recharge: Number(balance.recharge) || 0,
        bonus: Number(balance.bonus) || 0,
        hpRatio: typeof balance.hpRatio === "number" ? balance.hpRatio : null,
        fpRatio: typeof balance.fpRatio === "number" ? balance.fpRatio : null,
        reason: balance.reason || null,
      },
      context: {
        available: Boolean(context.available),
        used: Number(context.used) || 0,
        total: Number(context.total) || 0,
        percent: Number(context.percent) || 0,
        freePercent: typeof context.freePercent === "number" ? context.freePercent : null,
        reason: context.reason || null,
      },
    };
    if (balance.available) {
      var symbol = balance.currency === "USD" ? "$" : "¥";
      // The two wallet bars carry the amount only; their length already says
      // where they sit against the ¥50 mark.
      moved = setBar("hp", balance.hpRatio, symbol + formatMoney(balance.recharge), "") || moved;
      moved = setBar("fp", balance.fpRatio, symbol + formatMoney(balance.bonus), "") || moved;
    } else {
      var unavailable = balance.reason === "signed-out" ? T("balance.signedOut") : T("balance.unavailable");
      setBar("hp", null, "—", unavailable);
      setBar("fp", null, "—", unavailable);
    }

    if (context.available) {
      // Stamina is a pool: the bar and its number both read as what is LEFT, so
      // a full bar means the entire context window is still free. The pale trail
      // then means stamina was spent, and the critical pulse means it is nearly
      // gone — which is what those cues should mean on a stamina bar.
      var freeRatio =
        typeof context.freeRatio === "number" ? context.freeRatio : 1 - context.ratio;
      var freePercent =
        typeof context.freePercent === "number"
          ? context.freePercent
          : 100 - context.percent;
      // 'remaining' is the default: a fuller bar is always better, which is what
      // the wallet bars mean too. 'used' is the same measurement the app's own
      // meter shows.
      var showUsed = config.staminaMode === "used";
      moved =
        setBar(
          "sp",
          showUsed ? context.ratio : freeRatio,
          (showUsed ? context.percent : freePercent) + "%",
          "",
        ) || moved;
    } else {
      // An empty stamina bar says so with a dash alone: the row is narrow, and
      // the reason (no session yet) is the host's business, not the badge's.
      setBar("sp", null, "–", "");
    }

    if (moved) markActive();
  }

  /**
   * The session the GUI is currently showing.
   *
   * The host cannot know this — session selection lives in the browser — so the
   * client half publishes a reader for the app's own `uiSession` service, and
   * the renderer names the session on every poll. Empty means "nobody has said",
   * and the host falls back to its own guess.
   * @returns the session id, or "".
   */
  function shownSessionId() {
    var read = window.__DSH_DSH_SESSION__;
    if (typeof read !== "function") return "";
    try {
      var id = read();
      return typeof id === "string" ? id : "";
    } catch (error) {
      return "";
    }
  }

  /** Poll the host once. */
  function poll() {
    var request;
    try {
      var url = BASE + "/state.json";
      var session = shownSessionId();
      if (session !== "") url += "?session=" + encodeURIComponent(session);
      lastSessionId = session;
      request = fetch(url, {
        credentials: "same-origin",
        cache: "no-store",
      });
    } catch (error) {
      goOffline();
      return;
    }
    request
      .then(function (response) {
        if (!response.ok) {
          var error = new Error("HTTP " + response.status);
          error.status = response.status;
          throw error;
        }
        return response.json();
      })
      .then(function (state) {
        failures = 0;
        if (root) root.classList.remove("dsh-sh--offline");
        applyConfig(state.config);
        render(state);
        if (!firstReported) {
          firstReported = true;
          positionHud();
          report("first-poll");
        } else {
          // A steady heartbeat rather than a mount-time snapshot: the host can
          // then always say whether the renderer is alive, where it landed, and
          // whether its taps still resolve — which is what makes a dead renderer
          // distinguishable from a stale reading.
          report("poll");
        }
      })
      .catch(function (error) {
        // A 404 is not a network blip: it means our own host half is gone, i.e.
        // the plugin was switched off. Two in a row and the HUD stands down.
        if (error && error.status === 404) {
          // A 404 is definitive, not a blip: this route is ours and it is gone.
          // Waiting for a second one only made the switch feel broken.
          standDown("404");
          return;
        }
        goOffline();
      });
  }

  /**
   * Put the app back exactly as it was found.
   *
   * Standing down is not just "stop drawing": this renderer hid the sidebar's
   * brand mark and label and injected a stylesheet. All of that is undone here,
   * so switching the plugin off restores the app's own brand row instead of
   * leaving a blank space where it used to be.
   */
  /** Poll the host half's liveness. Only a 404 counts: it is definitive. */
  function checkAlive() {
    fetch(BASE + "/health", { credentials: "same-origin", cache: "no-store" })
      .then(function (response) {
        if (!response.ok) {
          var error = new Error("HTTP " + response.status);
          error.status = response.status;
          throw error;
        }
      })
      .catch(function (error) {
        if (error && error.status === 404) standDown("liveness");
      });
  }

  function restoreApp() {
    if (brandRule && brandRule.parentNode) brandRule.parentNode.removeChild(brandRule);
    brandRule = null;
    for (var i = 0; i < hiddenNodes.length; i += 1) {
      if (hiddenNodes[i] && hiddenNodes[i].style) {
        hiddenNodes[i].style.removeProperty("visibility");
      }
    }
    hiddenNodes = [];
    if (!root) {
      var style = document.getElementById("dsh-souls-hud-style");
      if (style && style.parentNode) style.parentNode.removeChild(style);
      styled = false;
      styleReady = false;
    }
  }

  /**
   * Stop drawing and hand the brand row back, but keep a quiet watcher.
   *
   * This app has no page reload, so a one-way teardown would strand the user:
   * switching the plugin back on restores the routes and nothing else. The
   * watcher is one request every few seconds, and brings the HUD back by itself
   * — which is what makes the switch work in both directions.
   */
  function standDown(via) {
    if (watchTimer) return;
    try {
      localStorage.setItem(
        "dsh-sh-standdown",
        JSON.stringify({ at: Date.now(), via: via || "unknown" }),
      );
    } catch (error) {
      /* storage may be unavailable; the trace is not worth failing over */
    }
    if (pollTimer) clearInterval(pollTimer);
    if (positionTimer) clearInterval(positionTimer);
    if (idleTimer) clearTimeout(idleTimer);
    if (aliveTimer) clearInterval(aliveTimer);
    pollTimer = null;
    positionTimer = null;
    idleTimer = null;
    aliveTimer = null;
    if (styleTimer) clearTimeout(styleTimer);
    styleTimer = null;
    if (observer) {
      observer.disconnect();
      observer = null;

     * @param _ctx - the client Cordis context (nothing needs disposing).
     */

      // resolved, the HUD must still mount — the form is the optional half.
      var React = null;
      try {
        React = require("react");
      } catch (error) {
        React = null;
      }
      var locale = _ctx && _ctx.get ? _ctx.get("locale") : null;
      registerDictionaries(_ctx, locale);
      registerSettings(_ctx, React, locale);
      publishShownSession(_ctx);
      publishLocale(locale);
      var live = window[GUARD];
      if (live && typeof live.destroy === "function") {
        try {
          live.destroy();
        } catch (error) {
          // A half-built instance must never block its replacement.
        }

      if (previous && previous.parentNode) previous.parentNode.removeChild(previous);

      var script = document.createElement("script");
      script.src = RENDERER;
      script.async = false;
      script.dataset.dshBuilderHud = "client";

     * exactly what a second mount in the same page would do — and a second mount
     * is a normal event here (HMR re-imports this file). So a duplicate is
     * accepted silently: the strings are identical, and refusing to mount over it
     * would be worse.
     *
     * @param ctx - the client Cordis context.
     * @param locale - the app's locale service, or null when absent.
     */

      if (!ctx || !ctx.effect || !locale || typeof locale.register !== "function") return;
      ctx.effect(function () {

          return locale.register(NS, { zh: DICT.zh, en: DICT.en });
        } catch (error) {
          return undefined;
        }

     * Publish "which session is the GUI showing" for the renderer to name on
     * every poll.
     *
     * Session selection lives in the browser, not in the host, so the host can
     * only guess — and its guess (newest root session) never moved when the user
     * switched sessions, which is exactly why the stamina bar described the

        var barsNow =
          balance && balance.available
            ? t("bars.now", {

              output: t("burn.output", { value: rate(live.outputTokensPerMin) }),
              cache: t("burn.cache", { value: rate(live.cacheTokensPerMin) }),

        // configuration: a window that is not the default opens itself, because
        // then it is something the user set deliberately.

        var windowOpen = windowState[0];
        var setWindowOpen = windowState[1];
        var windowIsCustom =
          config.offPeakUtcStart !== "16:30" || config.offPeakUtcEnd !== "00:30" || config.offPeakWeekends === false;
        var showWindow = windowOpen === null ? windowIsCustom : windowOpen;

        // The burn ring is in every cell. When the meter has no reading yet the
        // board draws a sample fill rather than an empty ring, and says so.

        var gaugeNote = gaugeLive

        var preview = cells
          ? React.createElement(
              "div",
              { style: { display: "flex", flexDirection: "column", gap: "6px" } },
              React.createElement(
                "div",
                { style: { display: "flex", gap: "14px", flexWrap: "wrap" } },

        return React.createElement(
          "div",
          { style: { paddingTop: "2px" } },

          React.createElement("div", { style: introStyle }, t("page.intro")),

              { style: { display: "flex", flexDirection: "column", gap: "6px", paddingTop: "6px" } },

            React.createElement(

                    function (value) {

            "bars",
          ),

          // 4. The ring: what it measures, and the one part of its colour rule

          section(
            t("section.burn"),
            t("section.burnHint"),
            React.createElement(
              "div",
              null,
              readout(burnNow, "burn-now"),
              field(
                t("burn.scale.label"),
                t("burn.scale.hint", {
                  rate: typeof live.tokensPerMin === "number" ? t("burn.rate", { value: rate(live.tokensPerMin) }) : t("burn.warming"),

                React.createElement(
                  "div",
                  { style: { display: "flex", alignItems: "center", gap: "8px" } },

                "burn-scale",

              field(
                t("burn.tint.label"),
                t("burn.tint.hint"),
                checkbox(config.offPeakBadge, function (value) {

                "tariff-toggle",
              ),
              React.createElement(
                "div",
                { style: { paddingTop: "6px" } },
                React.createElement(
                  "button",
                  {

                    style: disclosureStyle,
                    disabled: busy,

                React.createElement("div", { style: hintStyle }, t("burn.advancedHint")),

                      "div",
                      null,
                      React.createElement("div", { style: Object.assign({}, labelStyle, { paddingTop: "10px" }) }, t("burn.windowLabel")),
                      grid([

                          t("tariff.start"),
                          null,
                          clockInput("offPeakUtcStart", config.offPeakUtcStart),
                          "tariff-start",
                        ),
                        cell(t("tariff.end"), null, clockInput("offPeakUtcEnd", config.offPeakUtcEnd), "tariff-end"),
                      ]),
                      React.createElement(
                        "div",
                        { style: { paddingTop: "8px" } },
                        toggle(t("tariff.weekends"), config.offPeakWeekends, function (value) {
                          save({ offPeakWeekends: value });

                  : null,

            ),
            "burn",
          ),

          React.createElement(
            "div",
            { style: Object.assign({}, hintStyle, { minHeight: "18px", paddingTop: "10px" }) },
            busy ? t("status.saving") : status === "saved" ? t("status.saved") : status === "failed" ? t("status.failed") : "",

      };
    }

    /**
     * Register the settings form against this plugin's row.

        return ctx.slots.inject("plugins.row.config", function () {

                // `locale` is what makes the owner hand the component its `t`

    exports.name = name;
    exports.inject = ["slots"];
    exports.apply = apply;

  },
});
