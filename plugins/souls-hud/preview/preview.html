   * (the sidebar expands, collapses to a rail, and hides entirely).
   *
   * @returns {x, y} in viewport pixels, or null when the layout is not found.
   */
  function chatAnchor() {
    var column = findLaidOut('[class*="centerCol"]');
    var left = column ? column.rect.left : null;
    if (left === null) {
      // A shell that composes the columns differently: the sidebar's edge is
      // the next best statement of "where the chat starts".
      var sidebar = findLaidOut('[class*="sidebarCol"]');
      if (sidebar) left = sidebar.rect.right;
    }
    if (left === null) return null;

    var bottom = null;
    if (column) {
      // The header band is the element that starts at the column's own top. A
      // message-level header further down the transcript must never win, or the
      // cluster is placed below the fold.
      var headers = column.node.querySelectorAll('[class*="_header"]');
      for (var i = 0; i < headers.length; i += 1) {
        var rect = visibleRect(headers[i]);
        if (!rect) continue;
        if (rect.width < column.rect.width * 0.5) continue;
        if (Math.abs(rect.top - column.rect.top) > 8) continue;
        bottom = rect.bottom;
        break;
      }
      if (bottom === null) {
        var tabs = findLaidOut('[class*="_tabs"]', column.node);
        if (tabs) bottom = tabs.rect.bottom;
      }
      // Nothing identifiable: start at the top of the message area rather than
      // trusting a possibly-stale absolute offset.
      if (bottom === null) bottom = column.rect.top;
    }
    return {
      x: left + config.gapX,
      y: (bottom === null ? config.offsetY : bottom) + config.gapY,
    };
  }

  /**
   * Hide the brand *label* so the whale mark stands alone beside the bars.
   *
   * The slot contract is the primary hook. The geometric sweep is the fallback
   * for a build that does not stamp `data-slot`: it hides leaf text inside the
   * brand band, to the right of the mark and on the mark's vertical centre —
   * never containers, so the sidebar structure is untouched.
   *
   * @param markRect - the mark's laid-out rect.
   * @param sidebarNode - the sidebar column element.
   */
  function hideBrandRow(markRect, sidebarNode) {
    if (!brandRule) {
      brandRule = document.createElement("style");
      brandRule.id = "dsh-souls-hud-brand";
      // Both halves of the row: the cluster supplies its own mark and the bars
      // replace the label. visibility (not display) keeps the layout, so the
      // row's geometry is still available for anchoring.
      brandRule.textContent =
        BRAND_MARK_SLOT + "," + BRAND_NAME_SLOT + "{visibility:hidden !important}";
      document.head.appendChild(brandRule);
    }
    if (Date.now() - lastBrandSweep < 2000) return;
    lastBrandSweep = Date.now();

    // The label may not carry the slot attribute, so also hide leaf text that
    // shares the mark's row and sits to its right. Leaves only — hiding a
    // container would take the whole sidebar with it.
    var centre = markRect.top + markRect.height / 2;
    var nodes = sidebarNode.querySelectorAll("span,div,p,em,strong");
    for (var i = 0; i < nodes.length; i += 1) {
      var node = nodes[i];
      if (root && (node === root || node.contains(root))) continue;
      if (node.querySelector("span,div,p,em,strong")) continue;
      var text = (node.textContent || "").trim();
      if (!text || text.length > 40) continue;
      var rect = visibleRect(node);
      if (!rect) continue;
      if (Math.abs(rect.top + rect.height / 2 - centre) > 12) continue;
      if (rect.left < markRect.right - 2) continue;
      if (node.style.visibility === "hidden") continue;
      node.style.visibility = "hidden";
      hiddenNodes.push(node);
    }
  }

  /**
   * Find the brand mark. The slot contract is tried first, but this build does
   * not stamp `data-slot` on the brand row — so the mark is located as the
   * sidebar's first laid-out inline SVG inside the top band, which is what the
   * whale actually is.
   *
   * @param sidebar - the laid-out sidebar column.
   * @returns {node, rect} for the mark, or null.
   */
  function findBrandMark(sidebar) {
    var bySlot = findLaidOut(BRAND_MARK_SLOT, sidebar.node);
    if (bySlot) return bySlot;
    // The mark may be an inline SVG or an <img>. Take the left-most candidate
    // in the sidebar's top band, ignoring anything inside a control — the
    // sidebar's collapse button sits at the top *right* and must never win.
    var candidates = sidebar.node.querySelectorAll("svg,img");
    var best = null;
    for (var i = 0; i < candidates.length; i += 1) {
      var node = candidates[i];
      if (node.closest && node.closest("button")) continue;
      var rect = visibleRect(node);
      if (!rect) continue;
      if (rect.top - sidebar.rect.top > 100) continue;
      if (rect.width < 12 || rect.height < 12) continue;
      if (!best || rect.left < best.rect.left) best = { node: node, rect: rect };
    }
    return best;
  }

  /**
   * Locate the brand row and fit the cluster into the space right of the whale.
   *
   * The bars take whatever width is left once the mark, the readout column and
   * a right inset are reserved, so the row always looks deliberate rather than
   * sized by guesswork.
   *
   * @returns {x, y, width} in viewport pixels, or null when the sidebar or its
   * brand row is not on screen (a collapsed layout, or the blank hero).
   */
  /**
   * Whether the cluster has nowhere to sit in the sidebar any more.
   *
   * Collapsed to a rail, there is no brand row for it to replace — and the app
   * hides that row rather than squashing it. Measured, not guessed: the rail's
   * width and the row's own box are both things only the document knows.
   *
   * @returns true when the cluster should float instead.
   */
  function sidebarCollapsed() {
    var sidebar = findLaidOut('[class*="sidebarCol"]');
    if (!sidebar || sidebar.rect.width < 120) return true;
    return !findBrandMark(sidebar);
  }

  /** The stored floating position, or null. */
  function readFloatPos() {
    try {
      var raw = window.localStorage.getItem(FLOAT_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (typeof parsed.x !== "number" || typeof parsed.y !== "number") return null;
      return { x: parsed.x, y: parsed.y };
    } catch (error) {
      return null;
    }
  }

  /** Remember where the cluster was dragged to. */
  function writeFloatPos(pos) {
    try {
      window.localStorage.setItem(FLOAT_KEY, JSON.stringify({ x: Math.round(pos.x), y: Math.round(pos.y) }));
    } catch (error) {
      /* a private-mode storage failure must not cost the drag */
    }
  }

  /**
   * Where a floating cluster starts: below the app's own tabs, by a margin.
   *
   * Not *beside* them — below, and by a good 44px. A chat's code blocks grow
   * sticky headers as they scroll past, and in a narrow window those slide up
   * under anything parked at the top of the rail.
   *
   * @returns `{x, y}` in viewport coordinates.
   */
  function floatStart() {
    var stored = readFloatPos();
    if (stored) return stored;
    var bottom = 0;
    var tabs = document.querySelectorAll('[role="tab"],[class*="tab"],[aria-selected]');
    for (var i = 0; i < tabs.length; i += 1) {
      var node = tabs[i];
      if (root && root.contains(node)) continue;
      var rect = node.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0 && rect.top < 180 && rect.left < 240) {
        bottom = Math.max(bottom, rect.bottom);
      }
    }
    // 44: the margin the sticky code-block headers need.
    return { x: 10, y: Math.round((bottom || 52) + 44) };
  }

  /**
   * Put the floating cluster at an explicit point.
   *
   * Separate from {@link positionFloat} because the drag and the periodic tick want
   * different things: the tick must leave a drag alone, and the drag must be able to
   * move the cluster *during* the drag. Using one function for both is what made the
   * cluster follow the pointer only at release — the move handler called the
   * tick-flavoured version, which saw `drag` set and did nothing.
   *
   * @param x - viewport x.
   * @param y - viewport y.
   * @returns the clamped position that was applied.
   */
  function applyFloat(x, y) {
    if (!root) return null;
    var placed = clampToViewport(x, y);
    root.style.setProperty("--dsh-sh-x", Math.round(placed.x) + "px");
    root.style.setProperty("--dsh-sh-y", Math.round(placed.y) + "px");
    return placed;
  }

  /** Put the floating cluster where it belongs — unless a drag is in progress. */
  function positionFloat() {
    if (!root || drag) return;
    if (!floatPos) floatPos = floatStart();
    applyFloat(floatPos.x, floatPos.y);
    var width = Math.round(Number(config.barWidth) || 96);
    root.style.setProperty("--dsh-sh-width", Math.max(72, Math.min(240, width)) + "px");
  }

  /**
   * Let the floating cluster be dragged, with a threshold.
   *
   * The medallion is also the way into the settings, so a press that does not
   * move is a click and a press that moves is a drag. Without the threshold the
   * cluster would fly around every time someone tried to open its settings.
   */
  function bindDrag(node) {
    node.addEventListener("pointerdown", function (event) {
      if (!floatingNow || event.button !== 0) return;
      var rect = node.getBoundingClientRect();
      drag = {
        id: event.pointerId,
        fromX: event.clientX,
        fromY: event.clientY,
        x: rect.left,
        y: rect.top,
        moved: false,
      };
      node.classList.add("dsh-sh--dragging");
      // Deliberately *not* capturing here. `setPointerCapture` on pointerdown
      // retargets the later pointerup to this root, and the click that follows is
      // delivered to the nearest common ancestor of the press and the release —
      // which is this root, not the badge. The badge's own click handler then never
      // runs, so a press that did not move still did nothing. Capture belongs to the
      // drag, so it starts with the drag, below.
    });
    node.addEventListener("pointermove", function (event) {
      if (!drag || event.pointerId !== drag.id) return;
      var dx = event.clientX - drag.fromX;
      var dy = event.clientY - drag.fromY;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      if (!drag.moved) {
        // Now it is a drag, and only now does it take the pointer: past this point
        // the cluster must keep tracking even when the pointer leaves it.
        try {
          node.setPointerCapture(event.pointerId);
        } catch (error) {
          /* tracking still works without capture, it just stops at the edge */
        }
      }
      drag.moved = true;
      // Follow the pointer *now*: `applyFloat`, not the tick's `positionFloat`.
      floatPos = applyFloat(drag.x + dx, drag.y + dy) || floatPos;
      event.preventDefault();
    });
    var end = function (event) {
      if (!drag || event.pointerId !== drag.id) return;
      var moved = drag.moved;
      drag = null;
      node.classList.remove("dsh-sh--dragging");
      if (!moved) return;
      writeFloatPos(floatPos || floatStart());
      // Swallow the click the pointerup is about to become.
      suppressClick = true;
      window.setTimeout(function () {
        suppressClick = false;
      }, 0);
    };
    node.addEventListener("pointerup", end);
    node.addEventListener("pointercancel", end);
  }

  function sidebarAnchor() {
    var sidebar = findLaidOut('[class*="sidebarCol"]');
    if (!sidebar) return null;
    var brandMark = findBrandMark(sidebar);
    if (!brandMark) return null;
    hideBrandRow(brandMark.rect, sidebar.node);

    // The cluster draws its own mark at the row's left inset, so x is the row's
    // own start rather than the end of the app's mark.
    var x = Math.round(brandMark.rect.left);
    var stackHeight = 3 * BAR_H + 2 * ROW_GAP;
    var y = Math.round(
      brandMark.rect.top + (brandMark.rect.height - stackHeight) / 2,
    );

    // Everything the row gives up before the bars take their share.
    var LOGO_W = 20;
    var LOGO_GAP = 9;
    // A permanently hidden readout does not need its column, so the bars take it.
    var READOUT_W = config.numbers === "hidden" ? 0 : 44;
    var ROW_GAP_PX = config.numbers === "hidden" ? 0 : 6;
    var RIGHT_INSET = 14;
    var width =
      sidebar.rect.right - RIGHT_INSET - x - LOGO_W - LOGO_GAP - READOUT_W - ROW_GAP_PX;
    width = Math.max(48, Math.min(240, Math.round(width)));
    return { x: x, y: y, width: width };
  }

  /** Keep the cluster inside the viewport, whatever the layout reported. */
  function clampToViewport(x, y) {
    var minX = config.anchor === "sidebar" ? 6 : 88;
    return {
      x: Math.min(Math.max(x, minX), Math.max(minX, window.innerWidth - 140)),
      y: Math.min(Math.max(y, 0), Math.max(0, window.innerHeight - 80)),
    };
  }

  /** Place the cluster; re-run whenever the layout may have moved. */
  function positionHud() {
    if (!root) return;
    // Self-heal the one failure that ruins the whole page: a mount without its
    // stylesheet is in normal document flow, so it lands at the bottom of the
    // app and drags it into a scrollbar. `styled` is true while an attempt is in
    // flight and false once it has given up, so this only restarts a chain that
    // has actually stopped.
    if (!styleReady && !styled) {
      styled = true;
      styleAttempt(0, function () {});
    }
    // Switching sessions must move the stamina bar now, not at the next 15s
    // poll: this timer already runs every 600ms, and the comparison is a string.
    if (shownSessionId() !== lastSessionId) poll();
    // Collapsed sidebar: there is no row to sit in, so the cluster floats and can
    // be dragged. Decided every tick, because the user can collapse the rail at
    // any moment and the app does not announce it.
    var collapsed = sidebarCollapsed();
    if (collapsed !== floatingNow) {
      floatingNow = collapsed;
      root.classList.toggle("dsh-sh--float", collapsed);
      if (!collapsed) floatPos = null;
    }
    if (collapsed) {
      positionFloat();
      sizeMarkToBars();
      return;
    }
    var x = config.offsetX;
    var y = config.offsetY;
    var width = config.barWidth;
    if (config.anchor === "sidebar") {
      var fit = sidebarAnchor();
      if (fit) {
        x = fit.x;
        y = fit.y;
        width = fit.width;
      }
    } else if (config.anchor === "chat") {
      var anchored = chatAnchor();
      if (anchored) {
        x = anchored.x;
        y = anchored.y;
      }
    }
    var placed = clampToViewport(x, y);
    root.style.setProperty("--dsh-sh-x", Math.round(placed.x) + "px");
    root.style.setProperty("--dsh-sh-y", Math.round(placed.y) + "px");
    root.style.setProperty("--dsh-sh-width", Math.round(width) + "px");
    sizeMarkToBars();
  }

  /**
   * Match the medallion's height to the bars' container.
   *
   * The two sit side by side, and the medallion reads as a companion to the
   * bars only if it is exactly as tall as they are — so its size is measured
   * rather than guessed, and it follows any change to bar height or spacing.
   */
  function sizeMarkToBars() {
    if (!mark || !stack) return;
    var height = Math.round(stack.getBoundingClientRect().height);
    if (height < 8 || height === markSize) return;
    markSize = height;
    mark.style.width = height + "px";
    mark.style.height = height + "px";
  }

  /**
   * Tell the host how this actually landed: the resolved offset, the rect the
   * cluster really occupies, and what element sits on top at that point. The
   * host cannot see any of this, and every one of them is a distinct failure
   * mode (never mounted / placed off-screen / covered by the app).
   * @param tag - which lifecycle moment this report is from.
   */
  function report(tag) {
    if (!root) return;
    var payload;
    try {
      payload = buildPayload(tag);
    } catch (error) {
      // Diagnostics must never die silently — and this one is called from a
      // promise callback, where a throw becomes an unhandled rejection that no
      // window.onerror handler can see. So a snapshot that cannot be built is
      // reported *as* the snapshot.
      payload = { tag: tag, snapshotError: String((error && error.stack) || error) };
    }
    try {
      fetch(BASE + "/beacon", {
        method: "POST",
        keepalive: true,
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      }).catch(function () {});
    } catch (error) {
      /* nothing left to try */
    }
  }

  /** Build the snapshot. Isolated so a throw can never lose the beacon. */
  function buildPayload(tag) {
    var rect = root.getBoundingClientRect();
    var column = findLaidOut('[class*="centerCol"]');
    var header = null;
    if (column) {
      var headers = column.node.querySelectorAll('[class*="_header"]');
      for (var i = 0; i < headers.length; i += 1) {
        var candidate = visibleRect(headers[i]);
        if (candidate) {
          header = {
            cls: String(headers[i].className).slice(0, 60),
            top: Math.round(candidate.top),
            bottom: Math.round(candidate.bottom),
            w: Math.round(candidate.width),
          };
          break;
        }
      }
    }
    var onTop = null;
    try {
      var probe = document.elementFromPoint(rect.left + 6, rect.top + 6);
      onTop = probe ? String(probe.id || probe.className || probe.tagName).slice(0, 60) : null;
    } catch {
      onTop = "elementFromPoint-threw";
    }
    return {
      tag: tag,
      viewport: [window.innerWidth, window.innerHeight],
      guard: Boolean(window.__DSH_SOULS_HUD__),
      rows: root.children.length,
      rect: {
        x: Math.round(rect.x),
        y: Math.round(rect.y),
        w: Math.round(rect.width),
        h: Math.round(rect.height),
      },
      css: {
        left: getComputedStyle(root).left,
        top: getComputedStyle(root).top,
        opacity: getComputedStyle(root).opacity,
        zIndex: getComputedStyle(root).zIndex,
        position: getComputedStyle(root).position,
        display: getComputedStyle(root).display,
        visibility: getComputedStyle(root).visibility,
      },
      column: column
        ? { left: Math.round(column.rect.left), top: Math.round(column.rect.top), w: Math.round(column.rect.width), cls: String(column.node.className).slice(0, 60) }
        : null,
      header: header,
      onTop: onTop,
      bodyChild: root.parentNode === document.body,
      settingsTrigger: findSettingsTrigger() !== null,
      lastStandDown: (function () {
        try {
          var raw = localStorage.getItem("dsh-sh-standdown");
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          return null;
        }
      })(),
      brandRow: (function () {
        function vis(selector) {
          var el = document.querySelector(selector);
          if (!el) return "absent";
          var r = el.getBoundingClientRect();
          return {
            visibility: getComputedStyle(el).visibility,
            w: Math.round(r.width),
            h: Math.round(r.height),
            text: (el.textContent || "").trim().slice(0, 18),
          };
        }
        return {
          mark: vis('[data-slot="sidebar.brand.mark"]'),
          name: vis('[data-slot="sidebar.brand.name"]'),
        };
      })(),
      contextMeter: (function () {
        var meter = findContextMeter();
        return meter
          ? { text: (meter.node.textContent || "").trim(), top: Math.round(meter.rect.top) }
          : null;
      })(),
      markDrawn: Boolean(mark && mark.parentNode),
      // What the badge is currently made of, and whether an uploaded device is
      // actually in hand — a `custom` setting with no usable file falls back to
      // the built-in mark, and that has to be visible from `/health`.
      badge: {
        device: paintedDevice,
        material: paintedMaterial,
        shape: paintedShape,
        custom: customDeviceState,
        tariff: lastTariff,
        burn: {
          ratio: Math.round(lastBurn.ratio * 1000) / 1000,
          level: lastBurn.level,
          tokensPerMin: lastBurn.tokensPerMin,
        },
      },
      // Which session the stamina bar is describing. `/health` then always says
      // what the bar means, and it is the only way to tell "the host has no
      // context for the shown session" from "the bar is stale".
      session: shownSessionId(),
    };
  }

  /** Apply the host-supplied appearance configuration. */
  function applyConfig(next) {
    if (!next) return;
    config = {
      pollMs: Math.max(1000, Number(next.pollMs) || defaults.pollMs),
      barWidth: Math.max(80, Number(next.barWidth) || defaults.barWidth),
      scale: Number(next.scale) || 1,
      anchor:
        next.anchor === "frame" || next.anchor === "chat"
          ? next.anchor
          : defaults.anchor,
      gapX: isFinite(Number(next.gapX)) ? Number(next.gapX) : defaults.gapX,
      gapY: isFinite(Number(next.gapY)) ? Number(next.gapY) : defaults.gapY,
      offsetX: isFinite(Number(next.offsetX)) ? Number(next.offsetX) : defaults.offsetX,
      offsetY: isFinite(Number(next.offsetY)) ? Number(next.offsetY) : defaults.offsetY,
      showText: next.showText !== false,
      numbers:
        next.numbers === 'hover' || next.numbers === 'hidden' ? next.numbers : 'always',
      staminaMode: next.staminaMode === 'used' ? 'used' : 'remaining',
      // Customization travels with the rest of the config, but note the trap the
      // previous author hit: this object is rebuilt from an explicit field list,
      // so a key added to `defaults` and to the host alone would never arrive.
      device: DEVICES.indexOf(next.device) === -1 ? defaults.device : next.device,
      material: MATERIALS.indexOf(next.material) === -1 ? defaults.material : next.material,
      shape: SHAPES.indexOf(next.shape) === -1 ? defaults.shape : next.shape,
      idleDimMs: Math.max(0, Number(next.idleDimMs) || 0),
      criticalPercent:
        typeof next.criticalPercent === "number"
          ? next.criticalPercent
          : defaults.criticalPercent,
    };
    root.style.setProperty("--dsh-sh-scale", String(config.scale));
    // The readouts are hidden with the class, not by unmounting them, so the
    // bars keep their length and nothing reflows when the pointer arrives.
    root.classList.toggle("dsh-sh--numbers-hover", config.numbers === "hover");
    root.classList.toggle("dsh-sh--numbers-hidden", config.numbers === "hidden");
    // The medallion: draw the chosen device, in the chosen metal. A `custom`
    // device needs its file first, so the fetch is kicked off and the mark
    // repaints when it lands (and falls back to the built-in mark until then).
    paintMark();
    if (config.device === "custom") {
      var stamp = next.customDevice && next.customDevice.present ? next.customDevice.updatedAt : 0;
      loadCustomDevice(stamp || 0);
    }
    positionHud();
    for (var i = 0; i < ROWS.length; i += 1) {
      var read = rows[ROWS[i].kind].value.parentNode;
      read.style.display = config.showText ? "" : "none";
    }
    if (pollTimer && config.pollMs !== activePollMs) {
      clearInterval(pollTimer);
      activePollMs = config.pollMs;
      pollTimer = setInterval(function () {
        poll();
      }, activePollMs);
    }
  }

  /** Remember that something moved, so the HUD stays bright for a while. */
  function markActive() {
    root.classList.add("dsh-sh--active");
    root.classList.remove("dsh-sh--dim");
    if (idleTimer) clearTimeout(idleTimer);
    if (config.idleDimMs > 0) {
      idleTimer = setTimeout(function () {
        root.classList.remove("dsh-sh--active");
        root.classList.add("dsh-sh--dim");
      }, config.idleDimMs);
    }
  }

  /**
   * Drive one bar.
   * @param kind - row key.
   * @param ratio - 0..1 fraction, or null when unknown.
   * @param valueText - primary readout.
   * @param detailText - secondary readout.
   */
  function setBar(kind, ratio, valueText, detailText) {
    var bar = rows[kind];
    if (!bar) return;
    bar.value.textContent = valueText;
    bar.detail.textContent = detailText || "";

    if (ratio === null || typeof ratio !== "number" || !isFinite(ratio)) {
      bar.row.classList.add("is-unknown");
      bar.row.classList.remove("is-critical");
      return;
    }
    bar.row.classList.remove("is-unknown");

    var next = clamp01(ratio);
    var prev = lastRatio[kind];
    var changed = bar.painted && Math.abs(next - prev) > 0.0005;

    // The pale trail only means something when vitals were lost.
    if (next < prev - 0.0005) {
      bar.ghost.style.transition = "none";
      bar.ghost.style.width = pct(prev);
      // Force a reflow so the frozen width commits before it animates down.
      void bar.ghost.offsetWidth;
      bar.ghost.style.transition = "";
      bar.fill.style.width = pct(next);
      if (bar.timer) clearTimeout(bar.timer);
      bar.timer = setTimeout(function () {
        bar.ghost.style.width = pct(next);
      }, 320);
    } else {
      bar.ghost.style.transition = "none";
      bar.ghost.style.width = pct(next);
      void bar.ghost.offsetWidth;
      bar.ghost.style.transition = "";
      bar.fill.style.width = pct(next);
    }

    lastRatio[kind] = next;

    if (next * 100 <= config.criticalPercent) bar.row.classList.add("is-critical");
    else bar.row.classList.remove("is-critical");

    if (changed) {
      bar.row.classList.remove("is-changed");
      void bar.row.offsetWidth;
      bar.row.classList.add("is-changed");
    }
    bar.painted = true;
    return changed;
  }

  /**
   * Point the burn gauge at a new fraction, in place.
   *
   * The gauge is one `<path>`; re-rendering the medallion on every poll would
   * throw away the DOM for a number that changes constantly, so only the `d`
   * attribute moves.
   *
   * @param ratio - 0..1 of the medal's edge to light up.
   */
  function paintGauge(ratio) {
    if (!mark) return;
    var path = mark.querySelector(".dsh-sh__gauge");
    if (!path) return;
    var next = gaugeAttributes(paintedShape, ratio);
    // An empty gauge is faded out rather than drawn: a round cap on the dash
    // boundary paints a dot at the path's start, which is visible as a lit point
    // on the octagon's top-left vertex with nothing burning.
    if (next.empty) path.setAttribute("data-empty", "1");
    else path.removeAttribute("data-empty");
    // The path itself never changes; only the dash slides, which is what the
    // stylesheet's transition can animate.
    if (path.getAttribute("stroke-dasharray") !== next.dasharray) {
      path.setAttribute("stroke-dasharray", next.dasharray);
    }
    path.setAttribute("stroke-dashoffset", next.dashoffset);
  }

  /**
   * Apply the host's burn and tariff reading to the badge.
   *
   * Two signals, two channels, so neither hides the other: the **length** of the
   * lit arc along the medal's milled edge is how fast tokens are being spent
   * right now, and its **colour** is which tariff window that spending falls in
   * (amber on peak hours, cool blue off-peak).
   *
   * @param state - the `/state.json` payload.
   */
  function renderBurn(state) {
    var burn = state.burn || {};
    var tariff = state.tariff || {};
    var ratio = typeof burn.ratio === "number" && isFinite(burn.ratio) ? clamp01(burn.ratio) : 0;
    var level = typeof burn.level === "number" && isFinite(burn.level) ? Math.max(0, Math.min(4, Math.round(burn.level))) : 0;
    lastBurn = {
      available: burn.available === true,
      ratio: ratio,
      level: level,
      tokensPerMin: typeof burn.tokensPerMin === "number" ? burn.tokensPerMin : null,
      outputTokensPerMin: typeof burn.outputTokensPerMin === "number" ? burn.outputTokensPerMin : null,
      cacheTokensPerMin: typeof burn.cacheTokensPerMin === "number" ? burn.cacheTokensPerMin : null,
      fullScaleTpm: Number(burn.fullScaleTpm) || Number(config.burnFullScaleTpm) || 0,
    };
    lastTariff =
      tariff.enabled === false ? "off" : tariff.peak === true ? "peak" : tariff.peak === false ? "offpeak" : "off";
    // The form shows *why* it is peak or off-peak, and when that changes: with two
    // windows and a holiday calendar, "peak" on its own is not an explanation.
    lastTariffDetail = {
      reason: typeof tariff.reason === "string" ? tariff.reason : null,
      window: tariff.window && typeof tariff.window.text === "string" ? tariff.window.text : null,
      utcClock: typeof tariff.utcClock === "string" ? tariff.utcClock : null,
      nextChangeAt: typeof tariff.nextChangeAt === "number" ? tariff.nextChangeAt : null,
      nextChangePeak: tariff.nextChangePeak === true,
      holidayName: typeof tariff.holidayName === "string" && tariff.holidayName ? tariff.holidayName : null,
      holidayDate: typeof tariff.holidayDate === "string" ? tariff.holidayDate : null,
      makeup: tariff.makeup === true,
      half: tariff.half !== false,
    };
    if (!mark) return;
    mark.setAttribute("data-burn", String(level));
    mark.setAttribute("data-tariff", lastTariff);
    paintGauge(ratio);
  }

  /** Paint one `/state.json` payload. */
  function render(state) {
    var moved = false;
    renderBurn(state);

    var balance = state.balance || {};
    var context = state.context || {};
    // What the bars are showing, kept for the settings form: it shows the live
    // numbers beside the caps and the context mode, so a cap is a decision about
    // something visible rather than a number in the abstract.
    lastLive = {
      balance: {
        available: Boolean(balance.available),
        currency: balance.currency === "USD" ? "USD" : "CNY",
        recharge: Number(balance.recharge) || 0,
        bonus: Number(balance.bonus) || 0,
        hpRatio: typeof balance.hpRatio === "number" ? balance.hpRatio : null,
        fpRatio: typeof balance.fpRatio === "number" ? balance.fpRatio : null,
        reason: balance.reason || null,
      },
      context: {
        available: Boolean(context.available),
        used: Number(context.used) || 0,
        total: Number(context.total) || 0,
        percent: Number(context.percent) || 0,
        freePercent: typeof context.freePercent === "number" ? context.freePercent : null,
        reason: context.reason || null,
      },
    };
    if (balance.available) {
      var symbol = balance.currency === "USD" ? "$" : "¥";
      // The two wallet bars carry the amount only; their length already says
      // where they sit against the ¥50 mark.
      moved = setBar("hp", balance.hpRatio, symbol + formatMoney(balance.recharge), "") || moved;
      moved = setBar("fp", balance.fpRatio, symbol + formatMoney(balance.bonus), "") || moved;
    } else {
      // Just the dash. The bars are unavailable, and a word next to them is a
      // word the numbers would have to compete with once they come back.
      setBar("hp", null, "\u2013", "");
      setBar("fp", null, "\u2013", "");
    }

    if (context.available) {
      // Stamina is a pool: the bar and its number both read as what is LEFT, so
      // a full bar means the entire context window is still free. The pale trail
      // then means stamina was spent, and the critical pulse means it is nearly
      // gone — which is what those cues should mean on a stamina bar.
      var freeRatio =
        typeof context.freeRatio === "number" ? context.freeRatio : 1 - context.ratio;
      var freePercent =
        typeof context.freePercent === "number"
          ? context.freePercent
          : 100 - context.percent;
      // 'remaining' is the default: a fuller bar is always better, which is what
      // the wallet bars mean too. 'used' is the same measurement the app's own
      // meter shows.
      var showUsed = config.staminaMode === "used";
      moved =
        setBar(
          "sp",
          showUsed ? context.ratio : freeRatio,
          (showUsed ? context.percent : freePercent) + "%",
          "",
        ) || moved;
    } else {
      // An empty stamina bar says so with a dash alone: the row is narrow, and
      // the reason (no session yet) is the host's business, not the badge's.
      setBar("sp", null, "–", "");
    }

    if (moved) markActive();
  }

  /**
   * The session the GUI is currently showing.
   *
   * The host cannot know this — session selection lives in the browser — so the
   * client half publishes a reader for the app's own `uiSession` service, and
   * the renderer names the session on every poll. Empty means "nobody has said",
   * and the host falls back to its own guess.
   * @returns the session id, or "".
   */
  function shownSessionId() {
    var read = window.__DSH_DSH_SESSION__;
    if (typeof read !== "function") return "";
    try {
      var id = read();
      return typeof id === "string" ? id : "";
    } catch (error) {
      return "";
    }
  }

  /** Poll the host once. */
  function poll() {
    var request;
    try {
      var url = BASE + "/state.json";
      var session = shownSessionId();
      if (session !== "") url += "?session=" + encodeURIComponent(session);
      lastSessionId = session;
      request = fetch(url, {
        credentials: "same-origin",
        cache: "no-store",
      });
    } catch (error) {
      goOffline();
      return;
    }
    request
      .then(function (response) {
        if (!response.ok) {
          var error = new Error("HTTP " + response.status);
          error.status = response.status;
          throw error;
        }
        return response.json();
      })
      .then(function (state) {
        failures = 0;
        if (root) root.classList.remove("dsh-sh--offline");
        applyConfig(state.config);
        render(state);
        if (!firstReported) {
          firstReported = true;
          positionHud();
          report("first-poll");
        } else {
          // A steady heartbeat rather than a mount-time snapshot: the host can
          // then always say whether the renderer is alive, where it landed, and
          // whether its taps still resolve — which is what makes a dead renderer
          // distinguishable from a stale reading.
          report("poll");
        }
      })
      .catch(function (error) {
        // A 404 is not a network blip: it means our own host half is gone, i.e.
        // the plugin was switched off. Two in a row and the HUD stands down.
        if (error && error.status === 404) {
          // A 404 is definitive, not a blip: this route is ours and it is gone.
          // Waiting for a second one only made the switch feel broken.
          standDown("404");
          return;
        }
        goOffline();
      });
  }

  /**
   * Put the app back exactly as it was found.
   *
   * Standing down is not just "stop drawing": this renderer hid the sidebar's
   * brand mark and label and injected a stylesheet. All of that is undone here,
   * so switching the plugin off restores the app's own brand row instead of
   * leaving a blank space where it used to be.
   */
  /** Poll the host half's liveness. Only a 404 counts: it is definitive. */
  function checkAlive() {
    fetch(BASE + "/health", { credentials: "same-origin", cache: "no-store" })
      .then(function (response) {
        if (!response.ok) {
          var error = new Error("HTTP " + response.status);
          error.status = response.status;
          throw error;
        }
      })
      .catch(function (error) {
        if (error && error.status === 404) standDown("liveness");
      });
  }

  function restoreApp() {
    if (brandRule && brandRule.parentNode) brandRule.parentNode.removeChild(brandRule);
    brandRule = null;
    for (var i = 0; i < hiddenNodes.length; i += 1) {
      if (hiddenNodes[i] && hiddenNodes[i].style) {
        hiddenNodes[i].style.removeProperty("visibility");
      }
    }
    hiddenNodes = [];
    if (!root) {
      var style = document.getElementById("dsh-souls-hud-style");
      if (style && style.parentNode) style.parentNode.removeChild(style);
      styled = false;
      styleReady = false;
    }
  }

  /**
   * Stop drawing and hand the brand row back, but keep a quiet watcher.
   *
   * This app has no page reload, so a one-way teardown would strand the user:
   * switching the plugin back on restores the routes and nothing else. The
   * watcher is one request every few seconds, and brings the HUD back by itself
   * — which is what makes the switch work in both directions.
   */
  function standDown(via) {
    if (watchTimer) return;
    try {
      localStorage.setItem(
        "dsh-sh-standdown",
        JSON.stringify({ at: Date.now(), via: via || "unknown" }),
      );
    } catch (error) {
      /* storage may be unavailable; the trace is not worth failing over */
    }
    if (pollTimer) clearInterval(pollTimer);
    if (positionTimer) clearInterval(positionTimer);
    if (idleTimer) clearTimeout(idleTimer);
    if (aliveTimer) clearInterval(aliveTimer);
    pollTimer = null;
    positionTimer = null;
    idleTimer = null;
    aliveTimer = null;
    if (styleTimer) clearTimeout(styleTimer);
    styleTimer = null;
    if (observer) {
      observer.disconnect();
      observer = null;
    }
    window.removeEventListener("resize", positionHud);
    if (root && root.parentNode) root.parentNode.removeChild(root);
    root = null;
    rows = {};
    restoreApp();
    var guard = window.__DSH_SOULS_HUD__;
    if (guard) guard.mounted = false;
    watchTimer = setInterval(wake, 4000);
  }

  /** Come back once the host half answers again. */
  function wake() {
    fetch(BASE + "/health", { credentials: "same-origin", cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.text();
      })
      .then(function () {
        clearInterval(watchTimer);
        watchTimer = null;
        failures = 0;
        styled = false;
        styleReady = false;
        boot();
      })
      .catch(function () {
        /* still off; keep waiting */
      });
  }

  /** Mark the HUD as unable to reach its host half. */
  function goOffline() {
    failures += 1;
    if (failures >= 2) root.classList.add("dsh-sh--offline");
  }

  /**
   * Coalesce repositions. The observer below fires on every transcript
   * mutation — a streaming answer mutates the DOM continuously — and each
   * reposition forces layout, so never run one per mutation.
   */
  function schedulePosition() {
    if (repositionPending) return;
    repositionPending = true;
    setTimeout(function () {
      repositionPending = false;
      positionHud();
    }, 120);
  }

  /**
   * Guarantee the artwork is actually in effect.
   *
   * The index injection ships a `<link rel="stylesheet">`, but a link that
   * silently fails leaves the cluster as unstyled block elements in normal
   * document flow — pushed to the bottom of the page and dragging the whole app
   * into a scrollbar. Rather than depend on that link, the renderer fetches the
   * same stylesheet and installs it as a `<style>`; the link stays as the
   * zero-latency first paint and this is the belt-and-braces second.
   *
   * @param done - called once styling is in place (or has definitively failed).
   */
  function ensureStyles(done) {
    if (styleReady || styled) {
      done();
      return;
    }
    styled = true;
    var settled = false;
    var settle = function () {
      if (settled) return;
      settled = true;
      done();
    };
    styleAttempt(0, settle);
  }

  /** How many times a failed stylesheet fetch is retried, and how far apart. */
  var STYLE_RETRIES = 5;
  var STYLE_RETRY_MS = 2000;

  /**
   * One attempt at fetching and installing the stylesheet.
   *
   * `settle` releases the mount gate, and the first attempt always settles, so
   * a stylesheet problem can never hold the HUD off the page. A failed attempt
   * then comes back on a timer instead of latching `styled` — latching was a
   * real bug: one failed fetch left the cluster as unstyled block elements in
   * normal document flow for the life of the page, dragging the whole app into
   * a scrollbar (the exact disaster the injected `<style>` is there to prevent)
   * with no way back short of switching the plugin off and on.
   *
   * @param attempt - retry index, 0 for the first try.
   * @param settle - releases the mount gate; runs at most once per mount.
   */
  function styleAttempt(attempt, settle) {
    var retry = function () {
      if (attempt >= STYLE_RETRIES) {
        // Give up latching, so a later ensureStyles() can start over.
        styled = false;
        return;
      }
      styleTimer = setTimeout(function () {
        styleAttempt(attempt + 1, settle);
      }, STYLE_RETRY_MS);
    };
    var request;
    try {
      request = fetch(BASE + "/hud.css", { cache: "no-store" });
    } catch (error) {
      settle();
      retry();
      return;
    }
    request
      .then(function (response) {
        return response.ok ? response.text() : "";
      })
      .then(function (text) {
        if (!text) {
          settle();
          retry();
          return;
        }
        var style = document.getElementById("dsh-souls-hud-style");
        if (!style) {
          style = document.createElement("style");
          style.id = "dsh-souls-hud-style";
          document.head.appendChild(style);
        }
        style.textContent = text;
        styleReady = true;
        styled = true;
        settle();
      })
      .catch(function () {
        settle();
        retry();
      });
  }

  /** Start the HUD. */
  function boot() {
    if (!document.body) {
      setTimeout(boot, 50);
      return;
    }
    ensureStyles(ready);
  }

  /** Mount and start once styling is settled. */
  function ready() {
    mount();
    positionHud();
    markActive();
    report("mount");
    // The app's own mount finishes after ours; re-report once the layout is up.
    setTimeout(function () {
      positionHud();
      report("settled");
    }, 1200);
    poll();
    aliveTimer = setInterval(checkAlive, 3000);
    activePollMs = config.pollMs;
    pollTimer = setInterval(function () {
      poll();
    }, activePollMs);
    // The sidebar expands, collapses to a rail and hides behind an animation,
    // and the tab row can appear or vanish with the view — so re-anchor often
    // enough to follow, cheaply (two laid-out reads).
    positionTimer = setInterval(positionHud, 600);
    window.addEventListener("resize", positionHud);
    // The chat column does not exist yet on the blank-session hero; catch it
    // as soon as it mounts.
    if (typeof MutationObserver === "function") {
      observer = new MutationObserver(schedulePosition);
      observer.observe(document.body, { childList: true, subtree: true });
    }
    window.__DSH_SOULS_HUD__.mounted = true;
  }

  /**
   * Tear the HUD down and release the single-instance guard, so a client-half
   * reload can mount a fresh one.
   */
  function destroy() {
    if (watchTimer) clearInterval(watchTimer);
    if (aliveTimer) clearInterval(aliveTimer);
    aliveTimer = null;
    watchTimer = null;
    if (pollTimer) clearInterval(pollTimer);
    if (positionTimer) clearInterval(positionTimer);
    if (idleTimer) clearTimeout(idleTimer);
    pollTimer = null;
    positionTimer = null;
    idleTimer = null;
    activePollMs = 0;
    if (styleTimer) clearTimeout(styleTimer);
    styleTimer = null;
    if (observer) {
      observer.disconnect();
      observer = null;
    }
    window.removeEventListener("resize", positionHud);
    if (root && root.parentNode) root.parentNode.removeChild(root);
    root = null;
    rows = {};
    mark = null;
    stack = null;
    paintedDevice = null;
    paintedMaterial = null;
    paintedShape = null;
    restoreApp();
    window.__DSH_SOULS_HUD__ = null;
  }

  /**
   * Force an immediate poll.
   *
   * The settings form calls this after a save: the renderer's own poll is up to
   * 15 seconds away, and a preference that takes 15 seconds to show up reads as
   * a broken switch. Safe to call at any time, including while unmounted.
   */
  function refresh() {
    if (!root || !window.__DSH_SOULS_HUD__ || !window.__DSH_SOULS_HUD__.mounted) return;
    poll();
  }

  /**
   * Render a *standalone* medallion, for the settings form's preview.
   *
   * The live mark is painted by `hud.css`: its gradients live in the markup under
   * fixed ids and take their stops from `--dsh-sh-*`, so the stylesheet owns both
   * the metal and the theme. That works because there is exactly one live mark.
   * A preview is a second medallion on the same page, and SVG ids are
   * document-global — it would resolve `url(#dsh-sh-device)` to the *live*
   * mark's gradient and show the wrong metal.
   *
   * So the preview is self-contained instead:
   *
   *   - its own uniquely-suffixed gradient ids;
   *   - stop colours read out of the stylesheet, so the palettes still live in
   *     exactly one place (`hud.css`) and the preview matches the active theme;
   *   - the device's paint baked in as literal `url(#…)`, because the
   *     stylesheet's paint rules are scoped to the live mark.
   *
   * The *field* is left to the stylesheet: the preview's wrapper carries the
   * same `data-material` / `data-device` the live mark does, so the metal and the
   * covenant enamel both resolve from CSS.
   *
   * @param options - `{ device, shape, material, custom, gauge, dark }`; `gauge`
   *   is the burn fraction to draw (defaults to the live reading) and `dark`
   *   bakes the dark cut's stops instead of the page's current ones.
   * @returns the SVG markup.
   */
  function previewSvg(options) {
    var opts = options || {};
    var device = DEVICES.indexOf(opts.device) === -1 ? "whale" : opts.device;
    var shape = SHAPES.indexOf(opts.shape) === -1 ? defaults.shape : opts.shape;
    var uid = "dsh-shp" + (previewSeq += 1);
    var palette = previewPalette(opts.material, device, opts.dark === true);
    var gauge = typeof opts.gauge === "number" && isFinite(opts.gauge) ? clamp01(opts.gauge) : lastBurn.ratio;
    var markup = medallionSvg({ device: device, shape: shape, custom: opts.custom, gauge: gauge });
    // Concrete stop colours first, while the palette variable names are still
    // the stylesheet's — renaming the ids below also rewrites `--dsh-sh-device-N`
    // (it contains the role token), and a lookup after that would miss every
    // device stop and silently fall back to the bronze literals.
    markup = markup.replace(
      /style="stop-color:var\((--dsh-sh-[a-z0-9-]+)(?:,[^)]*)?\)"/g,
      function (match, name) {
        var value = palette[name];
        return value ? 'stop-color="' + value + '"' : match;
      },
    );
    // Then unique ids: the references are rewritten with them.
    // Every id in the frame, in this order. `heat` before `plate`: a split/join on
    // `dsh-sh-plate` would otherwise reach inside `dsh-sh-heat-plate`. (Classes are
    // safe from this pass by convention — ids use one hyphen, classes two.)
    ["heat", "plate", "recess", "device", "clip"].forEach(function (role) {
      markup = markup.split("dsh-sh-" + role).join(uid + "-" + role);
    });
    // The paint pass is bounded to the device group's *own* subtree — repainting
    // the hairline cracks or the overlay's rim as if they were solid shapes fills
    // them in, and (found the hard way) a slice that ran to `</svg>` also caught
    // whatever the renderer drew after the device: their `fill="none"` shapes came
    // back with a stroke attribute spliced in after the closing bracket.
    var deviceStart = markup.lastIndexOf('<g class="dsh-sh__device"');
    var deviceEnd = deviceStart === -1 ? -1 : groupEnd(markup, deviceStart);
    if (deviceStart !== -1 && deviceEnd > deviceStart) {
      markup =
        markup.slice(0, deviceStart) +
        paintDeviceLiterally(markup.slice(deviceStart, deviceEnd), uid + "-device") +
        markup.slice(deviceEnd);
    }
    return markup;
  }

  /**
   * The index just past the `<g>` that opens at `start`.
   *
   * Counts nested groups, so it finds the *matching* close rather than the first
   * one: the device group contains the fit transform's group, and the frame
   * contains several more after it.
   *
   * @param markup - the markup to scan.
   * @param start - index of the opening tag.
   * @returns the index after its closing tag; the length when unbalanced.
   */
  function groupEnd(markup, start) {
    var depth = 0;
    var at = start;
    while (at < markup.length) {
      var open = markup.indexOf("<g", at);
      var close = markup.indexOf("</g>", at);
      if (close === -1) return markup.length;
      if (open !== -1 && open < close) {
        depth += 1;
        at = open + 2;
        continue;
      }
      depth -= 1;
      at = close + 4;
      if (depth === 0) return at;
    }
    return markup.length;
  }

  /**
   * The settings form's preview board: one cell per theme and tariff window.
   *
   * Four combinations, because they are three independent axes and the point of a
   * preview is to show the combinations the user cannot see at once — a peak
   * amber gauge on a dark badge while the page is light, and so on:
   *
   *   - the app's two themes (each baked into the metal stops and forced onto the
   *     cell's wrapper, which is what `[data-ds-dark-theme]` now matches);
   *   - the two tariff windows, which only recolour the burn gauge;
   *   - plus the device, shape and metal the form is currently set to, and the
   *     gauge at the live burn ratio.
   *
   * It lives here rather than in the form so the form and `test/preview.mjs`
   * render byte-identical cells: a preview that disagrees with the badge is worse
   * than none.
   *
   * @param options - `{ device, shape, material, custom, gauge, size }`.
   * @returns four `{ dark, tariff, html }` cells, dark first.
   */
  function previewCells(options) {
    var opts = options || {};
    var device = DEVICES.indexOf(opts.device) === -1 ? "whale" : opts.device;
    var shape = SHAPES.indexOf(opts.shape) === -1 ? defaults.shape : opts.shape;
    var material = MATERIALS.indexOf(opts.material) === -1 ? "bronze" : opts.material;
    var custom = opts.custom || sanitizedCustomDevice();
    // `custom` with nothing usable falls back to the mark, in the attribute as
    // well as in the markup, so the enamel follows the device that is drawn.
    var painted = device === "custom" && !custom ? "whale" : device;
    var gauge = typeof opts.gauge === "number" && isFinite(opts.gauge) ? clamp01(opts.gauge) : lastBurn.ratio;
    var size = Math.max(24, Math.min(96, Number(opts.size) || 40));
    var cells = [];
    [true, false].forEach(function (dark) {
      ["peak", "offpeak"].forEach(function (tariff) {
        var markup = previewSvg({
          device: device,
          shape: shape,
          material: material,
          custom: custom,
          gauge: gauge,
          dark: dark,
        });
        cells.push({
          dark: dark,
          tariff: tariff,
          html:
            (dark ? '<span data-ds-dark-theme="">' : "<span>") +
            '<span class="dsh-sh__mark" data-preview data-material="' + material +
            '" data-device="' + painted + '" data-tariff="' + tariff +
            // The cut, stated rather than inherited. The form's board draws all four
            // combinations inside whatever theme the app happens to be in, and an
            // ancestor test cannot tell "the app is dark" from "this cell is light".
            '" data-cut="' + (dark ? "dark" : "light") +
            '" style="width:' + size + "px;height:" + size + 'px;display:inline-block">' +
            markup +
            "</span></span>",
        });
      });
    });
    return cells;
  }

  /**
   * Read the metal's palette out of the stylesheet.
   *
   * A probe element with the mark's own class is the only honest way to ask
   * "what colour is iron, in the theme that is on screen" — the values live in
   * `hud.css`, and the dark cut is selected by an ancestor that only the live
   * document has.
   *
   * @param material - bronze | iron | silver | gold.
   * @param device - device id, so a per-device tweak would be picked up too.
   * @param dark - read the dark cut rather than the page's current one.
   * @returns the resolved custom properties, keyed by name.
   */
  function previewPalette(material, device, dark) {
    var names = [
      "--dsh-sh-metal-0", "--dsh-sh-metal-1", "--dsh-sh-metal-2", "--dsh-sh-metal-3",
      "--dsh-sh-metal-4", "--dsh-sh-device-0", "--dsh-sh-device-1", "--dsh-sh-device-2",
      "--dsh-sh-device-3", "--dsh-sh-ink",
    ];
    var values = {};
    // The probe is inside a theme wrapper, because the dark cut is selected by an
    // *ancestor* — the page's own theme is not necessarily the one being drawn.
    var host = document.createElement("div");
    if (dark === true) host.setAttribute("data-ds-dark-theme", "");
    host.style.position = "absolute";
    host.style.left = "-9999px";
    host.style.top = "0";
    host.style.pointerEvents = "none";
    var probe = document.createElement("span");
    probe.className = "dsh-sh__mark";
    probe.setAttribute("data-preview", "");
    probe.setAttribute("data-material", MATERIALS.indexOf(material) === -1 ? "bronze" : material);
    probe.setAttribute("data-device", DEVICES.indexOf(device) === -1 ? "whale" : device);
    host.appendChild(probe);
    document.body.appendChild(host);
    try {
      var computed = getComputedStyle(probe);
      for (var i = 0; i < names.length; i += 1) {
        values[names[i]] = computed.getPropertyValue(names[i]).trim();
      }
    } finally {
      if (host.parentNode) host.parentNode.removeChild(host);
    }
    return values;
  }

  /**
   * Bake the stylesheet's device-paint contract into the markup.
   *
   * The same three cases the scoped CSS rules cover, applied to a string: a
   * filled shape takes the metal gradient, line art keeps `fill="none"` and takes
   * the metal as its stroke, and a shape with no fill at all — which would
   * otherwise render black — is filled.
   *
   * @param markup - medallion markup whose device still says `currentColor`.
   * @param gradient - the preview's own device-gradient id.
   * @returns the markup with literal paint.
   */
  function paintDeviceLiterally(markup, gradient) {
    var paint = "url(#" + gradient + ")";
    var shape = /^(path|polygon|polyline|circle|ellipse|rect|text|tspan|line)$/;
    return markup
      .replace(/<([a-zA-Z]+)((?:[^>"']|"[^"]*"|'[^']*')*)>/g, function (tag, name, attrs) {
        if (!shape.test(name.toLowerCase())) return tag;
        var out = attrs;
        if (/\bfill="currentColor"/.test(out)) {
          out = out.replace(/\bfill="currentColor"/, 'fill="' + paint + '"');
        } else if (/\bfill="none"/.test(out)) {
          if (!/\bstroke=/.test(out)) out += ' stroke="' + paint + '"';
        } else if (!/\bfill=/.test(out)) {
          out = ' fill="' + paint + '"' + out;
        }
        if (/\bstroke="currentColor"/.test(out)) {
          out = out.replace(/\bstroke="currentColor"/, 'stroke="' + paint + '"');
        }
        return "<" + name + out + ">";
      });
  }

  /**
   * The tariff window the badge is currently showing.
   *
   * The settings form's preview wrapper has to carry the same `data-tariff` the
   * live mark does, or its gauge would be the neutral colour while the badge's
   * is amber — and the form has no other way to see through to the renderer.
   *
   * @returns `'peak' | 'offpeak' | 'off'`.
   */
  function tariffReading() {
    return lastTariff;
  }

  /**
   * The live reading: what the bars and the ring are showing right now.
   *
   * The form reads this rather than fetching `/state.json`, so the numbers it
   * prints beside a cap are the numbers the badge is drawing — one source of
   * truth, no second poll.
   *
   * @returns `{ balance, context, tariff, burn }`; fields are null until the
   *   renderer has seen its first state.
   */
  function liveReading() {
    return {
      balance: lastLive.balance,
      context: lastLive.context,
      tariff: lastTariff,
      burn: lastBurn,
    };
  }

  /** The last burn reading, for the settings form's live number and preview. */
  function burnReading() {
    return {
      available: lastBurn.available,
      ratio: lastBurn.ratio,
      level: lastBurn.level,
      tokensPerMin: lastBurn.tokensPerMin,
      outputTokensPerMin: lastBurn.outputTokensPerMin,
      fullScaleTpm: lastBurn.fullScaleTpm,
      tariff: lastTariff,
      tariffDetail: lastTariffDetail,
    };
  }

  /**
   * Sanitize an upload on behalf of the settings form.
   *
   * The form parses the file to normalize it before posting; the renderer owns
   * the same sanitizer that the badge uses, so the preview the form shows is
   * exactly what the HUD will draw — rather than a second, more optimistic
   * implementation of what "safe" means.
   *
   * @param text - the raw upload.
   * @returns `{ viewBox, markup }`, or null.
   */
  function inspectUpload(text) {
    return sanitizeUploadedSvg(text);
  }

  window.__DSH_SOULS_HUD__.destroy = destroy;
  window.__DSH_SOULS_HUD__.refresh = refresh;
  window.__DSH_SOULS_HUD__.previewSvg = previewSvg;
  window.__DSH_SOULS_HUD__.previewCells = previewCells;
  window.__DSH_SOULS_HUD__.inspectUpload = inspectUpload;
  window.__DSH_SOULS_HUD__.tariffReading = tariffReading;
  /** The way into the settings, published so it can be driven without a click. */
  window.__DSH_SOULS_HUD__.openPluginSettings = openPluginSettings;
  window.__DSH_SOULS_HUD__.burnReading = burnReading;
  window.__DSH_SOULS_HUD__.liveReading = liveReading;


  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>
</body>
</html>
