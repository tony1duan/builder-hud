<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Souls HUD preview</title>
<style>/* ============================================================================
 * BuilderHUD — the Souls HUD stylesheet
 *
 * A Dark Souls vitals cluster shaped for the sidebar's brand row: an engraved
 * medallion on the left, three equal-length bars on the right.
 *
 * Straight right ends, a solid presence (no idle fading), a recessed near-black
 * socket, a warm engraved-metal rim, and a glassy top edge on each fill.
 * Everything is click-through and self-contained; it never reads app tokens.
 *
 * The medallion's *geometry* is fixed in `hud.js`; everything about how it
 * *looks* is here. Two knobs:
 *
 *   - `data-material` selects the metal (bronze | iron | silver | gold);
 *   - an ancestor carrying `data-ds-dark-theme` (the app puts it on `<body>`),
 *     *unless* the medal itself carries `data-cut="light"`. That exception is what
 *     keeps the settings preview honest: its light cells render inside whatever
 *     theme the app is in, and without it a dark app turned all four cells dark.
 *     selects that metal's dark cut. Written as an ancestor rather than `body`
 *     so the settings form's preview can show a dark cell inside a light page.
 *
 * Each material therefore has two full palettes — eight in all — and the plate
 * and the device read the same set of variables, so whatever is struck into the
 * field is literally cast from the same metal as the rim.
 * ========================================================================== */

:root {
  /* Overridden at runtime by the renderer, which measures the sidebar. These
     are the pre-measure fallback. */
  --dsh-sh-x: 20px;
  --dsh-sh-y: 40px;
  --dsh-sh-scale: 1;
  --dsh-sh-width: 96px;
  --dsh-sh-h: 9px;
  --dsh-sh-gap: 4px;
  --dsh-sh-ease: 1100ms;
}

#dsh-souls-hud {
  position: fixed;
  left: var(--dsh-sh-x);
  top: var(--dsh-sh-y);
  /* The app's own layering scale, read from its stylesheet: 10 dock scrim,
     70 menus, 100/101 popovers, 1000 modal root and backdrop, 1100 toasts.
     The cluster is chrome inside the sidebar, so it must sit above in-flow
     content but *under* every one of those overlays — the account menu and the
     context popover are opened from these bars, and the Settings modal has to
     cover them. 60 keeps it above the sidebar and below all of them. */
  z-index: 60;
  margin: 0;
  padding: 0;
  /* Mark on the left, the bar stack on the right. */
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 9px;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  /* Solid, always: the cluster is a fixture of the sidebar, not a HUD that
     fades in and out while you scroll. */
  opacity: 1;
  transform: scale(var(--dsh-sh-scale));
  transform-origin: 0 0;
  color: #cfc3a4;
  font-family: "Palatino Linotype", "Book Antiqua", Palatino, "Songti SC",
    "Times New Roman", serif;
  -webkit-font-smoothing: antialiased;
}

#dsh-souls-hud.dsh-sh--offline {
  opacity: 0.45;
}

/* --- the medallion, and the eight metals it can be cast from ---------------- */

.dsh-sh__mark {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  display: block;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
}
/* The badge is a control: it leads to its own settings.
 *
 * `pointer-events: auto` is the load-bearing line. The cluster turns pointer
 * events off at the root so it never eats clicks meant for the app behind it, and
 * every interactive part has to opt back in — the bars do, and this did not, so
 * the badge was a button that no one could press. */
.dsh-sh__mark[role="button"] {
  cursor: pointer;
  pointer-events: auto;
}
.dsh-sh__mark[role="button"]:focus-visible {
  outline: 2px solid var(--dsh-sh-lip, rgba(255, 236, 196, 0.5));
  outline-offset: 2px;
  border-radius: 50%;
}
/* The row we scrolled to on the Plugins page, lit for a moment. */
.dsh-sh--lit {
  border-radius: 8px;
  box-shadow: 0 0 0 2px rgba(255, 168, 64, 0.55);
  transition: box-shadow 200ms ease;
}
.dsh-sh__mark > svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* Bronze, light — the original plate, and the default when nothing has been
   chosen yet. The five `metal` stops run the plate's bevel from the lit upper
   left to the shadowed lower right; the four `device` stops are the same light
   with less range, so the device reads as the same casting. */
.dsh-sh__mark,
.dsh-sh__mark[data-material="bronze"] {
  --dsh-sh-metal-0: #fdf1cd;
  --dsh-sh-metal-1: #d8b673;
  --dsh-sh-metal-2: #9a7a3e;
  --dsh-sh-metal-3: #5f4a20;
  --dsh-sh-metal-4: #2b2009;
  --dsh-sh-field: #efe6cf;
  --dsh-sh-lip: rgba(255, 245, 220, 0.5);
  --dsh-sh-crack: rgba(36, 24, 8, 0.46);
  --dsh-sh-pit: rgba(110, 86, 46, 0.4);
}

/* Iron, light — blue steel. It used to be a neutral grey a shade darker than
   silver, which at 16px read as "silver, in shadow"; the blue cast is what lets
   the two be told apart at a glance. */
.dsh-sh__mark[data-material="iron"] {
  --dsh-sh-metal-0: #e6f0f8;
  --dsh-sh-metal-1: #9fb3c4;
  --dsh-sh-metal-2: #6d8499;
  --dsh-sh-metal-3: #3f5365;
  --dsh-sh-metal-4: #1b2630;
  --dsh-sh-field: #dde7f0;
  --dsh-sh-lip: rgba(230, 242, 252, 0.52);
  --dsh-sh-crack: rgba(58, 80, 102, 0.42);
  --dsh-sh-pit: rgba(44, 66, 88, 0.4);
}

/* Silver, light — the brightest cut: a near-white bevel over a slate base. */
.dsh-sh__mark[data-material="silver"] {
  --dsh-sh-metal-0: #ffffff;
  --dsh-sh-metal-1: #e2e9ef;
  --dsh-sh-metal-2: #aab6c0;
  --dsh-sh-metal-3: #6d7b87;
  --dsh-sh-metal-4: #333c44;
  --dsh-sh-field: #e9eef3;
  --dsh-sh-lip: rgba(255, 255, 255, 0.62);
  --dsh-sh-crack: rgba(38, 28, 12, 0.34);
  --dsh-sh-pit: rgba(48, 36, 16, 0.34);
}

/* Gold, light — yellow metal: more saturation than bronze, less red. */
.dsh-sh__mark[data-material="gold"] {
  --dsh-sh-metal-0: #fff8d8;
  --dsh-sh-metal-1: #f3dc86;
  --dsh-sh-metal-2: #c9a13c;
  --dsh-sh-metal-3: #8a6a1c;
  --dsh-sh-metal-4: #43310a;
  --dsh-sh-field: #f4ecd0;
  --dsh-sh-lip: rgba(255, 250, 225, 0.55);
  --dsh-sh-crack: rgba(34, 22, 6, 0.46);
  --dsh-sh-pit: rgba(40, 26, 8, 0.44);
}

/* The dark cut of each metal. Not an inverted plate and not a dimmed one: the
   bevel is re-lit for a dark sidebar, the recess goes properly dark, and the
   device keeps enough contrast to stay legible at 16px. */
[data-ds-dark-theme] .dsh-sh__mark:not([data-cut="light"]),
[data-ds-dark-theme] .dsh-sh__mark:not([data-cut="light"])[data-material="bronze"] {
  --dsh-sh-metal-0: #c9a869;
  --dsh-sh-metal-1: #a07f42;
  --dsh-sh-metal-2: #6f5526;
  --dsh-sh-metal-3: #40300f;
  --dsh-sh-metal-4: #170f03;
  --dsh-sh-field: #322817;
  --dsh-sh-lip: rgba(255, 236, 196, 0.28);
  --dsh-sh-crack: rgba(0, 0, 0, 0.58);
  --dsh-sh-pit: rgba(0, 0, 0, 0.44);
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55));
}
[data-ds-dark-theme] .dsh-sh__mark:not([data-cut="light"])[data-material="iron"] {
  --dsh-sh-metal-0: #c6d9ea;
  --dsh-sh-metal-1: #8ba3b9;
  --dsh-sh-metal-2: #5a7089;
  --dsh-sh-metal-3: #32434f;
  --dsh-sh-metal-4: #101a21;
  --dsh-sh-field: #1f2c39;
  --dsh-sh-lip: rgba(210, 232, 250, 0.26);
  --dsh-sh-crack: rgba(0, 0, 0, 0.44);
  --dsh-sh-pit: rgba(132, 160, 186, 0.32);
}
[data-ds-dark-theme] .dsh-sh__mark:not([data-cut="light"])[data-material="silver"] {
  --dsh-sh-metal-0: #dbe5ee;
  --dsh-sh-metal-1: #aebcc8;
  --dsh-sh-metal-2: #7a8794;
  --dsh-sh-metal-3: #4a545e;
  --dsh-sh-metal-4: #1f262c;
  --dsh-sh-field: #242c33;
  --dsh-sh-lip: rgba(232, 242, 250, 0.26);
  --dsh-sh-crack: rgba(0, 0, 0, 0.5);
  --dsh-sh-pit: rgba(0, 0, 0, 0.38);
}
[data-ds-dark-theme] .dsh-sh__mark:not([data-cut="light"])[data-material="gold"] {
  --dsh-sh-metal-0: #e8d38a;
  --dsh-sh-metal-1: #c2a548;
  --dsh-sh-metal-2: #8d722a;
  --dsh-sh-metal-3: #574314;
  --dsh-sh-metal-4: #1f1704;
  --dsh-sh-field: #332a13;
  --dsh-sh-lip: rgba(255, 238, 180, 0.26);
  --dsh-sh-crack: rgba(0, 0, 0, 0.58);
  --dsh-sh-pit: rgba(0, 0, 0, 0.44);
}

/* --- the device is the material --------------------------------------------
   The stops are *defined as* metal stops, not as a second palette that happens
   to agree: whatever the plate's bevel is made of, the symbol stamped into it is
   made of the same thing. Custom properties are substituted where they are used,
   so these references resolve against the material block on the same element and
   the two can never drift apart.

   The light cut takes the darker half of the ramp (the motif has to read against
   a pale field); the dark cut takes the brighter half (against a dark one). */
.dsh-sh__mark {
  --dsh-sh-device-0: var(--dsh-sh-metal-1);
  --dsh-sh-device-1: var(--dsh-sh-metal-2);
  --dsh-sh-device-2: var(--dsh-sh-metal-3);
  --dsh-sh-device-3: var(--dsh-sh-metal-4);
  --dsh-sh-ink: var(--dsh-sh-metal-1);
}
[data-ds-dark-theme] .dsh-sh__mark:not([data-cut="light"]) {
  --dsh-sh-device-0: var(--dsh-sh-metal-0);
  --dsh-sh-device-1: var(--dsh-sh-metal-1);
  --dsh-sh-device-2: var(--dsh-sh-metal-2);
  --dsh-sh-device-3: var(--dsh-sh-metal-3);
}

/* --- heat: what peak hours do to the medal ----------------------------------
   A generic overlay, drawn once by `medallionSvg` and gated entirely from here:
   `.dsh-sh__heat` is invisible until the mark says `data-tariff="peak"`, and the
   burn level then turns it up. The ring is empty most of the time, so the ring
   cannot be the only thing that distinguishes the two tariff windows — the medal
   running hot can.

   Peak also lifts the whole badge (`brightness`/`saturate` on the frame), which is
   what makes it read as *hotter* rather than merely tinted. */
/* How much *wash* the cut can take. A pale cut flooded with orange loses the
   fractures entirely — the field goes the colour of the lava — so the light cut
   gets a third of the dark cut's wash. The fire inside the cracks is not scaled:
   that is the part worth seeing on either cut. */
.dsh-sh__mark {
  --dsh-sh-heat-scale: 0.34;
}
[data-ds-dark-theme] .dsh-sh__mark:not([data-cut="light"]) {
  --dsh-sh-heat-scale: 1;
}
.dsh-sh__mark .dsh-sh__heat {
  opacity: 0;
  transition: opacity 700ms ease;
}
.dsh-sh__mark[data-tariff="peak"] .dsh-sh__heat {
  opacity: 0.5;
}
.dsh-sh__mark[data-tariff="peak"][data-burn="1"] .dsh-sh__heat {
  opacity: 0.58;
}
.dsh-sh__mark[data-tariff="peak"][data-burn="2"] .dsh-sh__heat {
  opacity: 0.7;
}
.dsh-sh__mark[data-tariff="peak"][data-burn="3"] .dsh-sh__heat {
  opacity: 0.85;
}
.dsh-sh__mark[data-tariff="peak"][data-burn="4"] .dsh-sh__heat {
  opacity: 1;
}
/* The wash, scaled per cut; the fire below is not. */
.dsh-sh__mark .dsh-sh__heat-wash,
.dsh-sh__mark .dsh-sh__heat-field {
  opacity: var(--dsh-sh-heat-scale, 1);
}
/* Firelight in the fractures: a wide dim pass, then a narrow bright core. Two
   strokes rather than a blur, for the same reason the rim's shadow is two: a
   filter would need an id, and ids have to be re-pointed in the preview. */
.dsh-sh__mark .dsh-sh__heat-ember,
.dsh-sh__mark .dsh-sh__heat-glow,
.dsh-sh__mark .dsh-sh__heat-core,
.dsh-sh__mark .dsh-sh__heat-flare {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
/* Cooling metal around the fissure: wide and dim, and red — the outside of lava
   is where it has already begun to cool. */
.dsh-sh__mark .dsh-sh__heat-ember {
  stroke: rgba(126, 12, 0, 0.46);
}
/* The hot band. */
.dsh-sh__mark .dsh-sh__heat-glow {
  stroke: rgba(255, 74, 8, 0.78);
}
/* The molten centre, narrow and bright: the light comes from inside the crack. */
.dsh-sh__mark .dsh-sh__heat-core {
  stroke: rgba(255, 236, 198, 1);
}
/* The specular line inside the centre. */
.dsh-sh__mark .dsh-sh__heat-flare {
  stroke: rgba(255, 255, 245, 0.95);
}
/* Pools where the widest fissures open. */
.dsh-sh__mark .dsh-sh__heat-spill {
  fill: rgba(255, 168, 74, 0.85);
}
/* The metal around the field, where the heat meets the rim. */
.dsh-sh__mark .dsh-sh__heat-rim {
  stroke: rgba(255, 122, 34, 0.42);
}
/* The whole badge runs hotter at peak. */
.dsh-sh__mark[data-tariff="peak"] > svg {
  filter: brightness(1.07) saturate(1.06);
}
/* The hottest level breathes, like the ring does. */
.dsh-sh__mark[data-tariff="peak"][data-burn="4"] .dsh-sh__heat {
  animation: dsh-sh-heat-pulse 2.4s ease-in-out infinite;
}
@keyframes dsh-sh-heat-pulse {
  0%,
  100% {
    opacity: 0.78;
  }
  50% {
    opacity: 1;
  }
}

/* The plate's own outline, and the milled edge of a struck medal. */
.dsh-sh__mark .dsh-sh__edge {
  stroke: rgba(24, 18, 6, 0.85);
}
/* The shadow the rim casts inwards, on the band the gauge runs along. It is what
   separates the lit arc from the plate — without it the gauge and the gold of a
   bronze rim are the same value and the ring disappears. */
.dsh-sh__mark .dsh-sh__inset {
  stroke: rgba(28, 20, 8, 0.42);
}
.dsh-sh__mark .dsh-sh__inset-2 {
  stroke: rgba(20, 14, 4, 0.5);
}
[data-ds-dark-theme] .dsh-sh__mark:not([data-cut="light"]) .dsh-sh__inset {
  stroke: rgba(0, 0, 0, 0.5);
}
[data-ds-dark-theme] .dsh-sh__mark:not([data-cut="light"]) .dsh-sh__inset-2 {
  stroke: rgba(0, 0, 0, 0.58);
}
.dsh-sh__mark .dsh-sh__mill {
  stroke: rgba(255, 246, 222, 0.34);
}
[data-ds-dark-theme] .dsh-sh__mark:not([data-cut="light"]) .dsh-sh__edge {
  stroke: rgba(0, 0, 0, 0.72);
}
[data-ds-dark-theme] .dsh-sh__mark:not([data-cut="light"]) .dsh-sh__mill {
  stroke: rgba(255, 240, 205, 0.2);
}

/* The recessed field is the **material's**, and nothing else's.
   An experiment tinted it per device (a covenant-colour enamel: amber sun, blue
   moon, green wolf) to follow Dark Souls III's colour-coded covenant emblems. It
   read well, but it made the badge's *background* change when the user only meant
   to change the figure — so the device now decides the figure and the material
   decides everything around it. If the enamel comes back, it comes back as a
   setting, not as a side effect of picking a motif. */

/* Recessed field, its fractures, its pitting, and the device inside it. */
.dsh-sh__mark .dsh-sh__field {
  fill: var(--dsh-sh-field, #efe6cf);
}
.dsh-sh__mark .dsh-sh__lip {
  stroke: var(--dsh-sh-lip, rgba(255, 245, 220, 0.5));
}
/* The fractures: dark, because a crack is a gap. Each path carries its own
   `stroke-width` (see `crackPaths`), so this only sets the colour. */
.dsh-sh__mark .dsh-sh__cracks {
  stroke: var(--dsh-sh-crack, rgba(34, 22, 6, 0.5));
}

.dsh-sh__mark .dsh-sh__pits {
  fill: var(--dsh-sh-pit, rgba(110, 86, 46, 0.4));
}

/* --- the device ------------------------------------------------------------
   Everything the device draws is repainted from the metal, whatever the upload
   said its colours were. That is the whole "blend into the badge" contract, and
   it is enforced here rather than by trusting the file:

   - a *filled* shape (a normalized upload marks it `fill="currentColor"`) gets
     the device gradient, so it picks up the plate's own light direction;
   - *line art* (`fill="none"` plus a stroke) stays line art — filling it would
     turn a drawn outline into a blob — but it is struck from the same metal;
   - the catch-all covers anything a hand-edited file left without a fill at
     all, which would otherwise render as a black silhouette leaking through
     the metal.

   Scoped to `#dsh-souls-hud` on purpose. These rules name the live mark's
   gradient **by id**, and SVG ids are document-global: a second medallion on the
   page — the settings form's preview — would resolve `url(#dsh-sh-device)` to
   the live mark's gradient and show the wrong metal. The preview therefore draws
   its own, uniquely-identified gradients and is deliberately outside these
   rules. (Found the hard way: the devices × metals gallery rendered four
   identical metals.) */
#dsh-souls-hud .dsh-sh__mark .dsh-sh__device {
  color: var(--dsh-sh-ink, #cba96c);
  filter: drop-shadow(0 0.7px 0.6px rgba(18, 12, 2, 0.75));
}
#dsh-souls-hud .dsh-sh__mark .dsh-sh__device :is(path, polygon, polyline, circle, ellipse, rect, text, tspan) {
  fill: url(#dsh-sh-device);
}
#dsh-souls-hud .dsh-sh__mark .dsh-sh__device [fill="none"] {
  fill: none;
  stroke: url(#dsh-sh-device);
}
#dsh-souls-hud .dsh-sh__mark .dsh-sh__device [stroke="currentColor"] {
  stroke: url(#dsh-sh-device);
}
#dsh-souls-hud .dsh-sh__mark .dsh-sh__device line {
  fill: none;
  stroke: url(#dsh-sh-device);
}

/* --- the burn gauge and the tariff window ------------------------------------
   Two signals, two channels, so neither can hide the other:

   - the **length** of the lit arc along the milled edge is how fast tokens are
     being spent right now (`renderBurn` re-points the path; it runs exactly on
     the beaded rim, so what lights up is the medal's own edge);
   - its **colour** is the tariff window that spending falls in — orange-red on
     peak hours, cool blue off-peak, neutral when the reading is switched off.

   The coarse `data-burn` level (0–4) drives how insistent the arc looks, and the
   top level breathes. */
.dsh-sh__mark .dsh-sh__gauge {
  stroke: rgba(255, 246, 222, 0.62);
  stroke-width: 1.5;
  opacity: 0.85;
  /* The gauge is one full-length path whose visible arc is a dash: the fill is
     `stroke-dashoffset`, which CSS can animate. Rewriting the path's `d` on every
     poll — the first implementation — cannot be transitioned and snapped. */
  transition: stroke-dashoffset 1200ms cubic-bezier(0.25, 0.8, 0.3, 1),
    stroke 600ms linear, opacity 400ms linear;
}
/* Peak is *orange-red*, not amber: the rim is amber already (bronze and gold are
   both warm metals), so an amber ring merged into it. The redder hue both
   separates the arc from the plate and says what the window means. */
.dsh-sh__mark[data-tariff="peak"] .dsh-sh__gauge {
  stroke: #ff8b33;
  filter: drop-shadow(0 0 1.6px rgba(255, 108, 40, 0.85));
}
.dsh-sh__mark[data-tariff="offpeak"] .dsh-sh__gauge {
  stroke: #9fe3ff;
  filter: drop-shadow(0 0 1.4px rgba(120, 210, 255, 0.75));
}
.dsh-sh__mark[data-burn="2"] .dsh-sh__gauge {
  stroke-width: 1.7;
  opacity: 0.95;
}
.dsh-sh__mark[data-burn="3"] .dsh-sh__gauge {
  stroke-width: 1.9;
  opacity: 1;
  filter: drop-shadow(0 0 2.2px currentColor);
}
.dsh-sh__mark[data-burn="4"] .dsh-sh__gauge {
  stroke-width: 2.1;
  opacity: 1;
  filter: drop-shadow(0 0 2.8px rgba(255, 120, 48, 0.9));
  animation: dsh-sh-ember 1.8s ease-in-out infinite;
}
/* An empty gauge draws nothing.
 *
 * `stroke-dasharray: L` with the offset at `L` leaves the path start on a dash
 * boundary, and Chrome paints a zero-length dash there: with a round cap that is a
 * dot, which showed as a lit point at the octagon's top-left vertex while nothing
 * was burning. Fading it out keeps the round cap for the lit arc.
 *
 * After the level rules on purpose: they share this selector's specificity, so the
 * order is what decides. */
.dsh-sh__mark .dsh-sh__gauge[data-empty="1"] {
  opacity: 0;
}

/* The ember breathes at the top level; the arc itself stays put. */
@keyframes dsh-sh-ember {
  0%,
  100% {
    opacity: 0.78;
  }
  50% {
    opacity: 1;
  }
}

/* Floating: the sidebar is collapsed, so the brand row this cluster replaces is
   gone. It becomes a small card that can be dragged anywhere — and it needs its
   own surface, because nothing else is behind it any more. */
#dsh-souls-hud.dsh-sh--float {
  padding: 6px 8px;
  border-radius: 11px;
  cursor: grab;
  pointer-events: auto;
  background: rgba(250, 249, 246, 0.86);
  box-shadow: 0 6px 20px rgba(20, 16, 8, 0.22), 0 0 0 1px rgba(20, 16, 8, 0.06);
}
[data-ds-dark-theme] #dsh-souls-hud.dsh-sh--float {
  background: rgba(24, 23, 21, 0.82);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 236, 196, 0.07);
}
#dsh-souls-hud.dsh-sh--float.dsh-sh--dragging {
  cursor: grabbing;
  /* While dragging, the cluster must not select text under it. */
  user-select: none;
  -webkit-user-select: none;
}

/* The settings form's preview: a real medallion, drawn standalone. Its own metal
   is baked into the markup (see `previewSvg`), so it only needs the box. */
.dsh-sh__mark[data-preview] {
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
}


/* The three bars, stacked. */
.dsh-sh__stack {
  display: flex;
  flex-direction: column;
  gap: var(--dsh-sh-gap);
  min-width: 0;
}

/* --- the numeric readouts ------------------------------------------------ */
/* Hidden with opacity rather than by unmounting, so the bars keep their length
   and nothing reflows when the pointer arrives. */
.dsh-sh--numbers-hover .dsh-sh__read,

  /**

   * lead to the place that explains the number. Settings is found by its own
   * sidebar trigger rather than by a private route, so the app keeps ownership
   * of the navigation.
   *
   * @returns whether a trigger was found and clicked.
   */

      return (
        seat.querySelector('button,[role="button"],a') ||

    return null;
  }

   * looks for the sidebar's own trigger, the same way `findSettingsTrigger` does,

  /**

   * the manifests declare, which is what the page shows.
   *
   * @returns the row element, or null.

    return null;
  }

    // registered — the client half hands it over on this global, because a plain
    // injected script has no Cordis context of its own.
    // Recorded on the cluster so one attribute says which route was taken: this is

    // it has to survive being asked before the cluster mounts (the tests drive this

      } catch (error) {

    // host without the service, and because a click that lands the user somewhere
    // sensible beats a click that does nothing.

      // happens" is the one outcome a person cannot debug.

      return false;

      tries += 1;

      if (row) {

      if (tries < 14) window.setTimeout(look, 130);

  /**
   * Find the composer's context-percentage entry — the little ring plus "NN%"
   * in the stats line at the foot of the conversation. Tapping the stamina bar
   * must open that entry's own popover, not a second one of our own.
   *
   * It carries no stable slot key, so it is identified by being a control whose
   * entire label is a percentage, sitting in the bottom band of the viewport;
   * of any such controls the lowest wins.
   *
   * @returns {node, rect} or null.
   */

    var nodes = document.querySelectorAll('button,[role="button"]');

      var text = (nodes[i].textContent || "").trim();
      if (!/^\d{1,3}%$/.test(text)) continue;
      var rect = visibleRect(nodes[i]);
      if (!rect) continue;
      if (rect.top < floor) continue;
      if (!best || rect.top > best.rect.top) best = { node: nodes[i], rect: rect };

    return best;

  /**

   *
   * The account menu and the context popover are both created asynchronously
   * and are *painted* before any timer-based follow-up could move them, which is
   * what made the cluster flash: a menu blinked at the bottom-left, a popover
   * blinked at the bottom-right, and only then did the right surface appear.
   *
   * A MutationObserver runs as a microtask at the end of the task that inserted
   * the node, so this fires before the browser paints. Anything it hides is
   * therefore never seen in the wrong place.

        seen.push(node);

  /**

   *

    panel.style.setProperty("top", wanted.top + "px", "important");
    panel.style.setProperty("right", "auto", "important");
    panel.style.setProperty("bottom", "auto", "important");
    panel.style.setProperty("transform", "none", "important");
    panel.style.setProperty("margin", "0", "important");

  /**

   * it mounts — before the frame is painted — moved under the stamina bar, and
   * only revealed once its own popper has stopped repositioning it. So the
   * popover is never seen in the wrong place, at any point.

  /**
   * Open the Settings modal that shows the balance.
   *
   * The sidebar's settings seat is the account row, and clicking it opens the
   * account *menu* ("Settings / Feedback / Sign out") — the modal is one item
   * deeper. The menu is hidden the instant it mounts, so its blink at the
   * bottom-left is never painted, and its Settings item is clicked straight
   * away. Nothing is reconstructed: both are the app's own controls.

   * @returns whether the row was found and clicked.

        return /settings/i.test(node.textContent || "");

      },

    return true;
  }

  /** Build one vitals row and return its update surface. */
  function buildRow(spec) {
    var row = document.createElement("div");
    row.className = "dsh-sh__row";
    row.setAttribute("data-kind", spec.kind);

    var shell = document.createElement("div");
    shell.className = "dsh-sh__shell";

    var socket = document.createElement("div");
    socket.className = "dsh-sh__socket";

    var ghost = document.createElement("div");
    ghost.className = "dsh-sh__ghost";

    var fill = document.createElement("div");
    fill.className = "dsh-sh__fill";

    socket.appendChild(ghost);
    socket.appendChild(fill);
    shell.appendChild(socket);
    row.appendChild(shell);

    var read = document.createElement("div");
    read.className = "dsh-sh__read";
    var value = document.createElement("span");
    value.className = "dsh-sh__value";
    var detail = document.createElement("span");
    detail.className = "dsh-sh__detail";
    read.appendChild(value);
    read.appendChild(detail);
    row.appendChild(read);

    // The two wallet bars are the one interactive part: a tap opens Settings,
    // whose account page is where the number comes from. The stamina bar stays
    // inert, and the root stays click-through everywhere else.
    if (spec.action) {
      row.classList.add("dsh-sh__row--action");

    return {
      row: row,
      fill: fill,
      ghost: ghost,
      value: value,
      detail: detail,
      timer: 0,
      painted: false,
    };
  }

  /**

   * the covenant medals themselves: a metal plate, a milled edge, a bevel that

   * recessed field, hairline fractures and a scatter of pitting. Three things

        // The beaded edge of a struck medal, drawn as a dashed ring.

    // blur needs a filter, a filter needs an id, and every id in this markup has

     * where the rim meets the field — and the burn level turns it up. It is not

      : '<polygon points="' + geometry.octagon.field + '"/>';
    var heatPlate = round

      '<g class="dsh-sh__heat">' +
      '<g class="dsh-sh__heat-wash">' + heatPlate.replace("/>", ' fill="url(#dsh-sh-heat-plate)"/>') + "</g>" +
      '<g class="dsh-sh__heat-field">' + heatField.replace("/>", ' fill="url(#dsh-sh-heat-field)"/>') + "</g>" +

      '<stop offset="0" style="stop-color:var(--dsh-sh-metal-0,#fdf1cd)"/>' +
      '<stop offset="0.18" style="stop-color:var(--dsh-sh-metal-1,#d8b673)"/>' +
      '<stop offset="0.46" style="stop-color:var(--dsh-sh-metal-2,#9a7a3e)"/>' +
      '<stop offset="0.72" style="stop-color:var(--dsh-sh-metal-3,#5f4a20)"/>' +
      '<stop offset="1" style="stop-color:var(--dsh-sh-metal-4,#2b2009)"/>' +

      '<radialGradient id="dsh-sh-recess" cx="0.5" cy="0.4" r="0.66">' +
      // Deeper than it was (0.5 at 0.5): the field is where the device sits, and
      // a darker wall behind the gauge is most of what makes the arc legible.
      '<stop offset="0.44" stop-color="rgba(0,0,0,0)"/>' +
      '<stop offset="1" stop-color="rgba(0,0,0,0.62)"/>' +
      "</radialGradient>" +
      '<linearGradient id="dsh-sh-device" x1="0.18" y1="0.05" x2="0.82" y2="1">' +
      '<stop offset="0" style="stop-color:var(--dsh-sh-device-0,#f7e6ba)"/>' +
      '<stop offset="0.3" style="stop-color:var(--dsh-sh-device-1,#cba96c)"/>' +
      '<stop offset="0.62" style="stop-color:var(--dsh-sh-device-2,#8c6e3a)"/>' +
      '<stop offset="1" style="stop-color:var(--dsh-sh-device-3,#4d3c1b)"/>' +
      "</linearGradient>" +
      // Heat, not colour: these are literal warm stops on purpose. They are not
